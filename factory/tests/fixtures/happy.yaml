# Today's delivery path on a high-risk ticket, with one retried malformed
# intake handoff and one failed check. Review forks two reviewers and joins
# when both report; the re-review runs only the one that blocked.
# `sm.py simulate` ends in `approved`, waiting for the human.
events:
  - stage.ready: { run_id: "local:20261028T1200-19" }
  - preflight.done
  - intake.error
  - intake.done: { ready: "yes", risk: high }
  - start.done: { branch: ez/19-state-machine-engine }
  - implement.done
  - checks.failed
  - fix.done
  - checks.passed
  - review_behaviour.done: { verdict: approved, reviewed_sha: aaa, risk: low }
  - review_structure_security.done: { verdict: changes-requested, reviewed_sha: aaa, risk: high, blocking_ids: [S1] }
  - fix.done
  - checks.passed
  - review_structure_security.done: { verdict: approved, reviewed_sha: bbb, risk: high }
  - approve.done: { verdict: needs-human, reasons: [risk is high] }
  - publish.done: { pr_urls: ["https://example.invalid/pr/1"] }
  - ci.passed
  - retro.done
