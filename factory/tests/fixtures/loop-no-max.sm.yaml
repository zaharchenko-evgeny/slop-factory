# Invalid: a loop without max never ends.
version: 1
initial: in-review
vars: { fix_round: { type: int, default: 0 } }
actions: { review: {}, fix: {} }
states:
  in-review: { actor: agent }
  blocked: { actor: human }
transitions:
  - { from: in-review, on: review.done, loop: { counter: fix_round, on_exhausted: blocked }, do: fix }
  - { from: in-review, on: fix.done, do: review }
