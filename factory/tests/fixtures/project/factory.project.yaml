engine: 1
project:
  name: Project fixture
tracker:
  adapter: github-issues
  repository: example/project
repositories:
  - name: project
    url: https://github.com/example/project
    default_branch: main
    environment: read
    domains: [factory]
environments:
  read:
    repositories: [project]
    domains: [factory]
    secrets: []
    vm: standard
workflow: workflows/delivery.yaml
states:
  draft:
    kind: waiting
    store: {label: factory:draft}
  ready:
    kind: active
    store: {label: factory:ready}
  needs-review:
    kind: active
    store:
      field: {name: Status, value: Review}
  pr-approved:
    kind: active
    store: {pr: approved}
  pr-merged:
    kind: final
    store: {pr: merged}
commands:
  review:
    store: {label: factory:review}
  pr-review:
    store: {pr_label: factory:pr-review}
  close:
    store: {tag: close}