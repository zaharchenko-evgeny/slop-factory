format: 2
nodes:
  start:
    wakes_on: ["state ready"]
    when: { state: ready }
    role: script
    outcomes:
      started: { effects: [{ command: review }, { state: needs-review }] }
  review:
    wakes_on: ["command review", "command pr-review"]
    when: { state: needs-review }
    role: reviewer
    outcomes:
      reviewed: { effects: [{ uncommand: review }, { state: draft }] }
  merge:
    wakes_on: ["pr reviewed"]
    when: { state: pr-approved }
    role: script
    outcomes:
      merged: { effects: [{ merge: match-head }] }
