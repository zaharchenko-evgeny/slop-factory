# Valid: a fork inside one state, joined before the ticket moves on.
version: 1
initial: in-review
actions: { lint: {}, test: {}, publish: {} }
states:
  in-review: { actor: agent }
  approved: { actor: human }
  blocked: { actor: human }
transitions:
  - { from: in-review, on: gate.done, do: publish }
  - { from: in-review, on: gate.failed, to: blocked }
  - { from: in-review, on: publish.done, to: approved }
  - { from: approved, on: pr.merged, do: { parallel: [lint, test], join: all, name: gate }, to: in-review }
events: [pr.merged]
