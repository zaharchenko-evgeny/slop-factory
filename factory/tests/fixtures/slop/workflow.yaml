# Slop factory workflow: how the factory works. Stages, shared settings, then the nodes in delivery
# order. Every node is an agent + an environment + triggers + outcomes: the agent reports one outcome and
# the gate applies its effects (ADR-0021). Several triggers on a node are OR. States are stage labels, other
# labels (`risk:*`, `complexity:*` and `close:*` hold one value each) and PR states; routing is the labels outcomes add.
# Deterministic rules live only in `when`, an outcome's `if` (when it fails the gate applies `else`, or
# refuses) and the effects' own checks (a merge needs an approved head with green CI).
# Agents and environments are defined in factory.yaml; nodes name them.
# Merge order: factory.yaml defaults -> environment -> role -> agent -> settings below -> node.
# ADR-0024: `listens` names the ticket repositories whose events wake a node (default: every one); `writes` the
# repositories Air pushes to. Event nodes listen to both ticket repositories, so each runs as one automation
# per repository; the developer nodes write both, and each copy pushes only its own repository.

# Stage names come from the nodes (`when`, triggers, effects). Labels are <tracker.label_prefix><stage> (`factory.yaml`).
stages:
  final: [done, not-actionable]
  waiting: [draft, blocked, needs-answers]

settings:                         # every node inherits these; a node overrides them
  environments: [engine, team]    # ADR-0027: where a node runs unless it names its own (one copy per environment)
  limits:
    concurrent_deliveries: 2
    agent_runs_per_ticket: 8
    runs_per_day: 20
    stale_hours: 2
    stale_command_minutes: 30
    run_timeout_minutes: 30
    resume_cap: 3
    environment_repair_attempts: 2
    prompt_lines: { role: 160, lessons: 150, agents_md: 150 }   # `factory validate` fails a file above its limit

nodes:
  # --- A person -------------------------------------------------------------------------------
  human:                          # resume a ticket from any stage but done
    agent: human
    triggers: [manual]
    outcomes:
      triage: { if: { stage: "!done" }, effects: [{ stage: triage }] }
      ready:  { if: { stage: "!done" }, effects: [{ stage: ready }] }

  human-reply:                    # a person comments on a ticket or PR that waits for them: resume it
    agent: resume
    triggers: [{ ticket: commented }, { pr: commented }]
    when: { label: "factory:needs-human" }   # the label is on the PR (`on: pr`); resuming removes it
    output: read-only
    outcomes:
      triage:  { if: { stage: "!done" }, effects: [{ unlabel: "factory:needs-human", on: pr }, { stage: triage }] }
      ready:   { if: { stage: "!done" }, effects: [{ unlabel: "factory:needs-human", on: pr }, { stage: ready }] }
      skipped: {}                 # a factory comment, or the person asks for nothing

  ticket-reply:                   # a person answers a ticket that waits in blocked or needs-answers: resume it
    agent: resume
    triggers: [{ ticket: commented }]
    when: { stage: [blocked, needs-answers] }
    output: read-only
    outcomes:
      triage:  { effects: [{ stage: triage }] }
      ready:   { effects: [{ stage: ready }] }
      skipped: {}

  # --- Triage: scope, estimate when it can ------------------------------------------------------
  intake:
    agent: router
    environment: intake             # reads every repository, writes none
    triggers: [{ stage: triage }]
    when: { stage: triage }
    output: read-only
    settings: { max_repositories: 3 }
    outcomes:
      small-low:      { effects: [{ label: "complexity:small" },  { label: "risk:low" },  { stage: ready }] }
      small-high:     { effects: [{ label: "complexity:small" },  { label: "risk:high" }, { stage: ready }] }
      medium-low:     { effects: [{ label: "complexity:medium" }, { label: "risk:low" },  { stage: ready }] }
      medium-high:    { effects: [{ label: "complexity:medium" }, { label: "risk:high" }, { stage: ready }] }
      large-high:     { effects: [{ label: "complexity:large" },  { label: "risk:high" }, { stage: ready }] }
      ready:          { effects: [{ stage: ready }] }               # no estimate: dispatch makes one
      grill:          { effects: [{ comment: questions }, { stage: needs-answers }] }
      split:          { effects: [{ create-issues: children }, { stage: split }] }
      not-actionable: { effects: [{ comment: reason }, { label: "close:wont-do" }, { stage: not-actionable }] }
      duplicate:      { effects: [{ comment: reason }, { label: "close:duplicate" }, { stage: not-actionable }] }
      superseded:     { effects: [{ comment: reason }, { label: "close:superseded" }, { stage: not-actionable }] }
      bug:            { effects: [{ stage: investigating }] }       # a bug report with an unknown cause

  # --- Investigate: a bug report -> reproduced and diagnosed, or rejected with evidence ----------
  investigate:
    agent: dev
    triggers: [{ stage: investigating }]
    when: { stage: investigating }
    output: read-only
    settings: { mode: investigate }
    outcomes:
      bug:              { effects: [{ comment: reason }, { label: "factory:implement-medium" }, { stage: in-dev }] }
      intended:         { effects: [{ comment: reason }, { label: "close:intended" }, { stage: not-actionable }] }   # the evidence is in the comment
      cannot-reproduce: { effects: [{ comment: reason }, { stage: needs-answers }] }

  # --- Ready: estimate if needed, start the developer the size needs ----------------------------
  dispatch:
    agent: dispatcher
    triggers: [{ stage: ready }]
    when: { stage: ready, blockers: closed }
    output: read-only
    settings: { small_lines: 150, medium_lines: 400 }
    outcomes:
      small:  { effects: [{ label: "complexity:small" },  { label: "factory:implement-small" },  { stage: in-dev }] }
      medium: { effects: [{ label: "complexity:medium" }, { label: "factory:implement-medium" }, { stage: in-dev }] }
      large:  { effects: [{ label: "complexity:large" },  { label: "factory:implement-large" },  { stage: in-dev }] }
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }   # a person must act; notify tells the owner
      triage:  { effects: [{ comment: reason }, { stage: triage }] }    # not startable as written: scope it again

  # --- Implement: the developer sets the risk it found and picks the review ---------------------
  implement-small:
    agent: dev-cheap
    triggers: [{ label: "factory:implement-small" }]
    when: { stage: in-dev }
    output: create-pr
    settings: { mode: implement }
    outcomes:
      done-low:   { effects: [{ unlabel: "factory:implement-small" }, { label: "risk:low" }, { label: "factory:review-low", on: pr }, { stage: in-review }] }
      done-high:  { effects: [{ unlabel: "factory:implement-small" }, { label: "risk:high" }, { label: "factory:review-high", on: pr }, { stage: in-review }] }
      error:      { effects: [{ unlabel: "factory:implement-small" }, { label: "factory:implement-medium" }] }   # retry on a stronger model
      blocked:    { effects: [{ comment: reason }, { stage: blocked }] }

  implement-medium:
    agent: dev
    triggers: [{ label: "factory:implement-medium" }]
    when: { stage: in-dev }
    output: create-pr
    settings: { mode: implement }
    outcomes:
      done-low:   { effects: [{ unlabel: "factory:implement-medium" }, { label: "risk:low" }, { label: "factory:review-low", on: pr }, { stage: in-review }] }
      done-high:  { effects: [{ unlabel: "factory:implement-medium" }, { label: "risk:high" }, { label: "factory:review-high", on: pr }, { stage: in-review }] }
      error:      { effects: [{ unlabel: "factory:implement-medium" }, { label: "factory:implement-large" }] }
      blocked:    { effects: [{ comment: reason }, { stage: blocked }] }

  implement-large:
    agent: dev-strong
    triggers: [{ label: "factory:implement-large" }]
    when: { stage: in-dev }
    output: create-pr
    settings: { mode: implement }
    outcomes:
      done-low:   { effects: [{ unlabel: "factory:implement-large" }, { label: "risk:low" }, { label: "factory:review-low", on: pr }, { stage: in-review }] }
      done-high:  { effects: [{ unlabel: "factory:implement-large" }, { label: "risk:high" }, { label: "factory:review-high", on: pr }, { stage: in-review }] }
      blocked:    { effects: [{ comment: reason }, { stage: blocked }] }

  # --- Review: one review per ticket, chosen by risk; CI may still run (red CI: never approved) -----
  review-low:
    agent: reviewer-cheap
    triggers: [{ label: "factory:review-low" }]
    when: { stage: in-review, label: "risk:low" }   # risk:low picks this review
    output: read-only
    settings: { focus: [behaviour] }
    outcomes:
      approve-low:   { if: { ci: [green, pending, none] }, else: changes,   # never approve on red CI
                       effects: [{ review: approve-at-head }, { unlabel: "factory:review-low" }, { label: "risk:low" },
                                { label: "factory:automerge", on: pr }, { stage: approved }] }
      approve-risky: { if: { ci: [green, pending, none] }, else: changes,
                       effects: [{ review: approve-at-head }, { unlabel: "factory:review-low" }, { label: "risk:high" },
                                { label: "factory:needs-human", on: pr }, { stage: approved }] }   # merge risk medium or high: a person merges
      changes:       { effects: [{ review: request-changes-at-head }, { unlabel: "factory:review-low" }, { label: "factory:fix", on: pr }, { stage: changes-requested }] }

  review-high:
    agent: reviewer
    triggers: [{ label: "factory:review-high" }]
    when: { stage: in-review, label: "risk:high" }   # risk:high picks this review
    output: read-only
    settings: { focus: [full, structure-security] }
    outcomes:
      approve-low:   { if: { ci: [green, pending, none] }, else: changes,   # never approve on red CI
                       effects: [{ review: approve-at-head }, { unlabel: "factory:review-high" }, { label: "risk:low" },
                                { label: "factory:automerge", on: pr }, { stage: approved }] }
      approve-risky: { if: { ci: [green, pending, none] }, else: changes,
                       effects: [{ review: approve-at-head }, { unlabel: "factory:review-high" }, { label: "risk:high" },
                                { label: "factory:needs-human", on: pr }, { stage: approved }] }   # merge risk medium or high: a person merges
      changes:       { effects: [{ review: request-changes-at-head }, { unlabel: "factory:review-high" }, { label: "factory:fix", on: pr }, { stage: changes-requested }] }

  ci-failed:                      # CI finished red after the approval: the developer fixes it, then a new review
    agent: clerk
    triggers: [{ label: "factory:ci-red" }]   # ci-sync labels the PR from its checks
    when: { stage: approved }       # before the approval, the approve outcomes' CI guard turns red into changes
    outcomes:
      fix:     { if: { ci: red }, effects: [{ unlabel: "factory:automerge" }, { unlabel: "factory:merge" },
                                            { unlabel: "factory:needs-human" }, { label: "factory:fix", on: pr },
                                            { stage: changes-requested }] }
      waiting: {}                 # CI is green again or still running: nothing to do

  # --- Fix: review findings, red CI included -> a new head, reviewed again ---------------------
  fix:
    agent: dev
    triggers: [{ label: "factory:fix" }]
    when: { stage: [in-review, changes-requested, approved], fix-rounds: below-cap }
    output: push-to-source
    settings: { mode: fix, fix_rounds: 3 }
    outcomes:
      done-low:  { effects: [{ unlabel: "factory:fix" }, { label: "risk:low" }, { label: "factory:review-low", on: pr }, { stage: in-review }] }
      done-high: { effects: [{ unlabel: "factory:fix" }, { label: "risk:high" }, { label: "factory:review-high", on: pr }, { stage: in-review }] }
      blocked:   { effects: [{ unlabel: "factory:fix" }, { comment: reason }, { stage: blocked }] }

  rounds-out:                     # a fix label at the fix cap: no round left, a person decides (notify tells them)
    agent: clerk
    triggers: [{ label: "factory:fix" }]
    when: { stage: [in-review, changes-requested, approved], fix-rounds: at-cap }
    outcomes:
      blocked: { effects: [{ unlabel: "factory:fix", on: pr }, { stage: blocked }] }

  update:                         # a merge conflict
    agent: dev-cheap
    triggers: [{ label: "factory:update" }]
    when: { stage: changes-requested }
    output: push-to-source
    settings: { mode: update }
    outcomes:
      resolved:     { effects: [{ unlabel: "factory:update" }, { label: "factory:automerge", on: pr }, { stage: approved }] }
      unresolvable: { effects: [{ unlabel: "factory:update" }, { comment: reason }, { stage: blocked }] }

  # --- Approved -> merged -> done ---------------------------------------------------------------
  automerge:                      # an agent decides; high risk always goes to a person
    agent: approver
    triggers: [{ label: "factory:automerge" }]
    when: { stage: approved }
    output: read-only
    settings: { risky_paths: ["engine/**", ".github/**", ".air/**", "AGENTS.md", "**/AGENTS.md", "CLAUDE.md", "**/CLAUDE.md",
                              ".agents/**", "skills/**", "roles/**", "lessons/**", ".mcp.json", "**/.mcp.json"] }   # files that steer later agents
    outcomes:
      merge:       { if: { label: "risk:low" }, else: needs-human,
                     effects: [{ unlabel: "factory:automerge" }, { label: "factory:merge", on: pr }] }
      needs-human: { effects: [{ unlabel: "factory:automerge" }, { comment: reason, on: pr },
                                 { label: "factory:needs-human", on: pr }] }   # the person looks at the PR

  merge:                          # the guards choose; the merge effect checks head, approval and CI itself
    agent: clerk
    triggers: [{ label: "factory:merge" }]
    when: { stage: approved }
    outcomes:
      conflict: { if: { pr: conflicting }, effects: [{ unlabel: "factory:merge" }, { label: "factory:update", on: pr }, { stage: changes-requested }] }
      updated-low:  { if: { pr: behind, label: "risk:low" },  effects: [{ update-branch: match-head }, { unlabel: "factory:merge" },
                                                               { label: "factory:review-low", on: pr }, { stage: in-review }] }
      updated-high: { if: { pr: behind, label: "risk:high" }, effects: [{ update-branch: match-head }, { unlabel: "factory:merge" },
                                                               { label: "factory:review-high", on: pr }, { stage: in-review }] }
      merged:   { if: { review: approved-at-head, ci: green }, effects: [{ unlabel: "factory:merge" }, { merge: match-head }] }
      ci-red:   { if: { ci: red }, effects: [{ unlabel: "factory:merge" }, { label: "factory:fix", on: pr }, { stage: changes-requested }] }   # CI finished red after the review
      waiting:  {}                # reconcile wakes it again while CI runs

  finish:                         # a merged PR or finished split: done; the gate then wakes unblocked dependents
    agent: clerk
    triggers: [{ pr: merged }, { ticket: closed }]
    outcomes:
      done:          { if: { pr: merged, stage: "!done" }, effects: [{ stage: done }] }
      children-done: { if: { stage: split, children: closed }, effects: [{ stage: done }] }
      waiting:       {}

  # --- Notifications --------------------------------------------------------------------------
  notify:                         # a state that needs the owner: the agent writes one message, or skips
    agent: notify
    triggers: [{ stage: blocked }, { stage: needs-answers }]
    output: read-only
    outcomes:
      notified: { effects: [{ comment: message }, { assign: { field: assignee } }] }
      skipped:  {}

  notify-pr:                      # a PR that waits for the owner: the message goes on the PR
    agent: notify
    triggers: [{ label: "factory:needs-human" }]
    output: read-only
    outcomes:
      notified: { effects: [{ comment: message, on: pr }, { assign: { field: assignee }, on: pr }] }
      skipped:  {}

  # --- Knowledge: lessons -> retro -> review -> a person accepts ------------------------------
  retro:
    agent: retro
    environment: team
    triggers: [{ schedule: "0 2 * * *" }]
    output: as-instructed         # retro pushes and opens or updates the one retro PR itself; Air only pushes a branch
    outcomes:                     # a routine: the gate applies no effects, so retro labels its PR for knowledge-review
      proposed: {}
      nothing:  {}

  knowledge-review:               # not a `review-<focus>` variant: it reviews retro's PR, outside delivery
    agent: reviewer
    environment: team
    triggers: [{ label: "factory:knowledge-review" }]
    output: read-only
    settings: { focus: [knowledge] }
    outcomes:
      approve: { effects: [{ review: approve-at-head }, { unlabel: "factory:knowledge-review" }] }
      changes: { effects: [{ review: request-changes-at-head }, { unlabel: "factory:knowledge-review" }] }

  accept-knowledge:               # a person; a later node can accept automatically
    agent: human
    triggers: [manual]
    outcomes:
      accepted: { if: { pr: approved }, effects: [{ merge: match-head }] }
      rejected: { effects: [{ comment: reason, on: pr }] }

  # --- Routines -------------------------------------------------------------------------------
  reconcile:                      # re-fires missed wakes; polls CI for merge (Air has no CI-success trigger)
    agent: ops
    environment: team
    triggers: [{ schedule: "*/15 * * * *" }]
    settings: { routine: reconcile }
    outcomes:
      reconciled: {}

  doctor-engine:
    agent: ops
    environment: engine
    settings: { routine: doctor }
    triggers: [{ schedule: "0 5 * * *" }]
    outcomes:
      probed: {}

  doctor-team:
    agent: ops
    environment: team
    settings: { routine: doctor }
    triggers: [{ schedule: "0 5 * * *" }]
    outcomes:
      probed: {}
