# Slop factory workflow: how the factory works. Stages, shared settings, then the nodes in
# delivery order. A node = agent + environment + triggers + outcomes; the agent reports one
# outcome and the gate applies its effects. Several triggers on a node are OR. An outcome's `if`
# is a guard on ticket/PR fields; when it fails the gate applies `else`.
# Variants of an engine step are separate nodes named <step>-<variant>: implement-cheap,
# implement-mid, implement-strong (by complexity), fix-*, update-*, review-<focus>. Each has its own
# agent; the engine picks the variant (complexity, risk) and adds its label. Outcome names of
# these steps and of the gate nodes are the engine's.
# Agents, environments and webhooks are defined in factory.yaml; nodes name them.
# Merge order: factory.yaml defaults -> environment -> role -> agent -> settings below -> node.

# Stage names come from the nodes (`when`, triggers, effects). Labels are <label_prefix><stage>.
stages:
  label_prefix: "factory:"
  final: [done, not-actionable]
  waiting: [draft, blocked, needs-answers, investigating]

settings:                         # every node inherits these; a node overrides them
  environment: engine             # where a node runs unless it names one
  limits:
    concurrent_deliveries: 2
    agent_runs_per_ticket: 8
    runs_per_day: 20
    stale_hours: 2
    stale_command_minutes: 30
    run_timeout_minutes: 30
    resume_cap: 3
    environment_repair_attempts: 2

nodes:
  # --- A person -------------------------------------------------------------------------------
  human:                          # resume a ticket from any stage but done
    agent: human
    triggers: [manual]
    outcomes:
      triage: { if: { stage: "!done" }, effects: [{ stage: triage }] }   # run intake again
      ready:  { if: { stage: "!done" }, effects: [{ stage: ready }] }    # skip intake or restart

  # --- Intake: triage -> ready ----------------------------------------------------------------
  intake:
    agent: router
    triggers: [{ stage: triage }]
    when: { stage: triage }
    output: read-only
    settings: { max_changed_lines: 400, max_repositories: 3 }
    prompt: >-
      Scope the ticket in the trigger. Split it above {{ settings.max_changed_lines }} changed
      lines or {{ settings.max_repositories }} repositories.
    outcomes:
      proceed:        { effects: [{ set-field: risk }, { set-field: complexity }, { stage: ready }] }
      grill:          { effects: [{ comment: questions }, { stage: needs-answers }] }
      split:          { effects: [{ create-issues: children }, { stage: split }] }
      not-actionable: { effects: [{ comment: reason }, { stage: not-actionable }] }
      bug:            { enabled: false, effects: [{ stage: investigating }] }

  start:                          # ready -> in-dev; complexity small/medium/large picks implement-cheap/mid/strong
    agent: gate
    run: uv run factory/gate.py sweep
    triggers: [{ stage: ready }]
    when: { stage: ready, blockers: closed }
    outcomes:
      started: { if: { stage: ready }, effects: [{ label: "factory:implement-<tier>" }, { stage: in-dev }] }

  # --- Implement: in-dev -> in-review ---------------------------------------------------------
  implement-cheap:
    agent: dev-cheap
    triggers: [{ label: "factory:implement-cheap" }]
    when: { stage: in-dev }
    output: create-pr
    prompt: Implement the ticket in the trigger (mode `implement`).
    outcomes: &implement
      done:       { effects: [{ unlabel: "factory:implement-*" }, { stage: in-review }] }
      error:      { effects: [{ unlabel: "factory:implement-*" }, { label: "factory:implement-<next tier>" }, { stage: in-dev }] }
      blocked:    { effects: [{ comment: reason }, { stage: blocked }] }
      failed:     { effects: [{ comment: reason }, { stage: blocked }] }
      env-broken: { effects: [{ unlabel: "factory:implement-*" }, { park-behind-main-red: failing_check }, { stage: ready }] }

  implement-mid:
    agent: dev
    triggers: [{ label: "factory:implement-mid" }]
    when: { stage: in-dev }
    output: create-pr
    prompt: Implement the ticket in the trigger (mode `implement`).
    outcomes: *implement

  implement-strong:
    agent: dev-strong
    triggers: [{ label: "factory:implement-strong" }]
    when: { stage: in-dev }
    output: create-pr
    prompt: Implement the ticket in the trigger (mode `implement`).
    outcomes: *implement

  # --- Review: in-review -> approved | changes-requested --------------------------------------
  # join asks for the reviews `required` by the ticket's risk; each focus is a node.
  review-full:
    agent: reviewer
    triggers: [{ label: "factory:review-full" }, { label: "factory:rereview-full" }]
    when: { stage: in-review, ci: [green] }
    output: read-only
    settings: { focus: [full, structure-security] }
    prompt: Review the PR in the trigger with focus {{ settings.focus | join(" and ") }}.
    outcomes: &review
      approve: { effects: [{ review: approve-at-head }, { unlabel: "factory:review-<focus>" }] }
      changes: { effects: [{ review: request-changes-at-head }, { unlabel: "factory:review-<focus>" }] }

  review-cheap:
    agent: reviewer-cheap
    triggers: [{ label: "factory:review-cheap" }, { label: "factory:rereview-cheap" }]
    when: { stage: in-review, ci: [green] }
    output: read-only
    settings: { focus: [behaviour] }
    prompt: Review the PR in the trigger with focus {{ settings.focus | join(" and ") }}.
    outcomes: *review

  join:                           # counts agent reviews and people with write access; other bots never block
    agent: gate
    run: uv run factory/gate.py sweep
    triggers: [{ pr: reviewed }, { ci: failed }]
    when: { stage: in-review, ci: [green, red] }
    settings:
      required: { low: [cheap], high: [full] }   # review focuses each risk needs at the head
    outcomes:
      changes:  { effects: [{ label: "factory:fix-<tier>" }, { stage: changes-requested }] }
      approved: { if: { ci: green }, else: changes, effects: [{ stage: approved }] }
      waiting:  { if: { stage: in-review }, effects: [{ join: all-approve }] }

  # --- Fix and update: changes-requested -> in-review -----------------------------------------
  fix-cheap:
    agent: dev-cheap
    triggers: [{ label: "factory:fix-cheap" }]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    output: push-to-source
    settings: { fix_rounds: 3 }   # the gate blocks the ticket after this many rounds
    prompt: Fix the blocking findings and CI failures on the PR in the trigger (mode `fix`).
    outcomes: &fix
      done:           { effects: [{ unlabel: "factory:fix-*" }, { request-reviewers: changes }, { stage: in-review }] }
      blocked:        { if: { stage: changes-requested }, effects: [{ comment: reason }, { stage: blocked }] }
      env-broken:     { if: { stage: changes-requested }, effects: [{ unlabel: "factory:fix-*" }, { park-behind-main-red: failing_check }, { stage: ready }] }
      nothing-to-fix: { if: { stage: changes-requested }, effects: [{ unlabel: "factory:fix-*" }, { join: all-approve }, { stage: in-review }] }

  fix-mid:
    agent: dev
    triggers: [{ label: "factory:fix-mid" }]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    output: push-to-source
    settings: { fix_rounds: 3 }
    prompt: Fix the blocking findings and CI failures on the PR in the trigger (mode `fix`).
    outcomes: *fix

  fix-strong:
    agent: dev-strong
    triggers: [{ label: "factory:fix-strong" }]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    output: push-to-source
    settings: { fix_rounds: 3 }
    prompt: Fix the blocking findings and CI failures on the PR in the trigger (mode `fix`).
    outcomes: *fix

  update-cheap:                   # a merge conflict
    agent: dev-cheap
    triggers: [{ label: "factory:update-cheap" }]
    when: { stage: changes-requested }
    output: push-to-source
    prompt: Resolve the merge conflict on the PR in the trigger (mode `update`).
    outcomes: &update
      resolved:     { effects: [{ unlabel: "factory:update-*" }, { stage: in-review }] }
      escalate:     { effects: [{ unlabel: "factory:update-*" }, { label: "factory:update-<next tier>" }, { stage: changes-requested }] }
      unresolvable: { effects: [{ unlabel: "factory:update-*" }, { comment: reason }, { stage: blocked }] }

  update-strong:
    agent: dev-strong
    triggers: [{ label: "factory:update-strong" }]
    when: { stage: changes-requested }
    output: push-to-source
    prompt: Resolve the merge conflict on the PR in the trigger (mode `update`). A smaller model escalated it.
    outcomes: *update

  # --- Approved -> merged -> done -------------------------------------------------------------
  reopen:                         # a new head or red CI after approval
    agent: gate
    run: uv run factory/gate.py sweep
    triggers: [{ pr: pushed }, { ci: failed }]
    when: { stage: approved }
    outcomes:
      reopened: { if: { stage: approved }, effects: [{ stage: in-review }] }

  merge:
    agent: gate
    run: uv run factory/gate.py sweep
    triggers: [{ stage: approved }]   # reconcile wakes it again while CI runs
    when: { stage: approved, round: complete-at-head, ci: green }
    settings: { auto_merge: true, max_risk: high }   # above max_risk a person merges
    outcomes:
      merged:  { if: { stage: approved }, effects: [{ merge: match-head }] }
      updated: { if: { stage: approved }, effects: [{ update-branch: match-head }] }
      waiting: { if: { stage: approved }, effects: [{ comment: reason, on: pr }] }

  finish:
    agent: gate
    run: uv run factory/gate.py sweep
    triggers: [{ pr: merged }, { ticket: closed }, { stage: blocked }, { ticket: commented }]
    outcomes:
      answered:      { if: { stage: needs-answers }, effects: [{ stage: triage }] }
      children-done: { if: { stage: split }, effects: [{ stage: done }] }
      child-blocked: { if: { stage: split }, effects: [{ comment: reason }, { stage: blocked }] }
      conflict:      { if: { stage: approved }, effects: [{ label: "factory:update-cheap" }, { stage: changes-requested }] }
      merged:        { if: { stage: "!done" }, effects: [{ stage: done }] }

  # --- Notifications --------------------------------------------------------------------------
  notify:
    agent: inbox
    environment: team
    triggers: [{ stage: blocked }, { stage: needs-answers }, { webhook: inbox }]
    output: read-only
    settings: { github_user: zaharchenko-evgeny, inbox_title: Factory inbox }
    outcomes:
      notified: {}

  # --- Knowledge: lessons -> retro -> review -> a person accepts ------------------------------
  retro:
    agent: retro
    environment: knowledge
    triggers: [{ schedule: "0 2 * * *" }]
    output: push-to-new-branch    # the platform opens one PR to the knowledge base
    outcomes:
      proposed: { effects: [{ label: "factory:knowledge-review", on: pr }] }
      nothing:  {}

  knowledge-review:               # not a `review-<focus>` variant: it reviews retro's PR, outside delivery
    agent: reviewer
    environment: knowledge
    triggers: [{ label: "factory:knowledge-review" }]
    output: read-only
    settings: { focus: [knowledge] }
    prompt: Review the knowledge PR in the trigger with focus {{ settings.focus | join(" and ") }}.
    outcomes:
      approve: { effects: [{ review: approve-at-head }, { unlabel: "factory:knowledge-review" }] }
      changes: { effects: [{ review: request-changes-at-head }, { unlabel: "factory:knowledge-review" }] }

  accept-knowledge:               # a person; a later node can accept automatically
    agent: human
    triggers: [manual]
    outcomes:
      accepted: { if: { pr: approved }, effects: [{ merge: match-head }] }
      rejected: { effects: [{ comment: reason, on: pr }, { close: pr }] }

  # --- Routines -------------------------------------------------------------------------------
  reconcile:                      # re-fires missed wakes; polls CI for merge (Air has no CI-success trigger)
    agent: gate
    run: uv run factory/cli.py reconcile
    environment: team
    triggers: [{ schedule: "*/15 * * * *" }]
    outcomes:
      reconciled: {}

  recover:
    agent: gate
    run: uv run factory/gate.py sweep --stale
    triggers: [manual]
    outcomes:
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }

  doctor-engine:
    agent: gate
    run: uv run factory/cli.py doctor
    triggers: [{ schedule: "0 5 * * *" }]
    outcomes:
      probed: {}

  doctor-team:
    agent: gate
    run: uv run factory/cli.py doctor
    environment: team
    triggers: [{ schedule: "0 5 * * *" }]
    outcomes:
      probed: {}

  # --- Not built yet --------------------------------------------------------------------------
  investigate:                    # ticket 161
    enabled: false
    agent: dev
    triggers: [{ stage: investigating }]
    when: { stage: investigating }
    output: read-only
    outcomes:
      bug:              { effects: [{ comment: diagnosis }, { label: "factory:implement-mid" }, { stage: in-dev }] }
      intended:         { effects: [{ comment: reason }, { stage: not-actionable }] }
      cannot-reproduce: { effects: [{ comment: questions }, { stage: needs-answers }] }

  adopt:                          # ticket 160; a person adds factory:adopt to a PR with no ticket stage
    enabled: false
    agent: router
    triggers: [{ label: "factory:adopt" }]
    when: { stage: none }
    output: read-only
    outcomes:
      adopted: { if: { stage: none }, effects: [{ set-field: risk }, { stage: in-review }] }
