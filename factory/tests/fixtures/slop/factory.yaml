# Slop factory, definition v2. This file lists what the factory has: tracker, models, skills,
# roles, agents, environments. workflow.yaml says how they connect and run.
name: Slop factory
engine: "git+https://github.com/zaharchenko-evgeny/slop-factory@main"   # what the Air startup script installs
owner: zaharchenko-evgeny   # the GitHub login the notify node tells
tracker:
  adapter: github-issues
  repository: zaharchenko-evgeny/slop-factory
  repositories:               # ADR-0024: the ticket repositories; the first is the tracker
    - zaharchenko-evgeny/slop-factory
    - zaharchenko-evgeny/slop-eval-factory   # team tickets; retro's PRs wake knowledge-review here

# Model aliases: the only place a model ID appears.
models:
  luna:   { harness: codex,  model: gpt-6-luna }
  sonnet: { harness: claude, model: "claude-sonnet-5-5[1m]" }
  sol:    { harness: codex,  model: gpt-6.1-sol }

# Inherited by every node. Merge order: these defaults -> environment -> role -> agent ->
# workflow.yaml settings -> node; `null` clears a value.
defaults:
  model: luna
  env:
    GH_TOKEN: { required: true, secret: true, description: "gh as jetbrains-air[bot], set by Air" }
  mcp: {}
  skills: [simplified-technical-english]   # given to every role (the engine's factory-step always is)
  settings:
    branch_pattern: "ez/{ticket}-{slug}"
    commit_prefix: "#{ticket} "
    bot_login: "jetbrains-air[bot]"
    issues_token_env: FACTORY_ISSUES_TOKEN   # the gate's issue, label and comment writes to slop-eval-factory (slop-factory#652)
    confirm_external_writes: true
    confirm_external_writes_scope: []
    knowledge:                    # the knowledge base: an additional repository of the environments that read it
      repo: zaharchenko-evgeny/slop-eval-factory
      dir: lessons
      lesson_label: "factory:lesson"

# Skills. A skill is local (`path` in this repository) or from a source, pinned by commit or
# version and checked by sha256 at setup. Roles and defaults name skills from here; a role can also
# define a skill of its own inline (local under roles/<role>/skills/<name>, or from a source).
skills:
  ponytail:
    source: "npm:@dietrichgebert/ponytail@5.3.2"
    path: skills/ponytail
    sha256: b40d655883ea462755ae12373b59833fce20ba256bc06b0bc4e08dc59ba2ca5d
  ponytail-review:
    source: "npm:@dietrichgebert/ponytail@5.3.2"
    path: skills/ponytail-review
    sha256: 0a56beb5b3b9b89b363ce5d0a9ae5263cd431a6ecc9b3f57d7e795a889d626fd
  tdd:
    source: "github:cursor/plugins@4dd1d05818d1"
    path: pstack/skills/tdd
    sha256: 5cb44876b687184a55d1e4355a830374ccd5e0e4c361d19e8f5928d3496704b1
  diagnosing-bugs:
    source: "github:mattpocock/skills@a496f5513d4a"
    path: skills/engineering/diagnosing-bugs
    sha256: 29faf0d352422aa58beb0ce4666a49bdfdd5d2cc065c9dfe9be7b7e89fbdf584
  principle-test-behavior-not-implementation:
    source: "github:cursor/plugins@4dd1d05818d1"
    path: pstack/skills/principle-test-behavior-not-implementation
    sha256: c8b25ca3336056109d6eaf5a973e676945b389ab3d03a12ae8c8ba360869ee21
  to-tickets: { path: skills/to-tickets }   # a local copy: this team edited it after vendoring
  pr: { path: skills/pr }                   # adapted from mattpocock/skills (credits in the file)
  merge-risk: { path: skills/merge-risk }   # adapted from warpdotdev/common-skills (credits in the file)
  walkthrough: { path: skills/walkthrough } # adapted from warpdotdev pr-walkthrough + readout (credits in the file)
  simplified-technical-english: { path: skills/simplified-technical-english }   # adapted from 0xpili/simplified-technical-english, MIT (NOTICE.md)
  resolve-merge-conflicts:
    source: "github:warpdotdev/common-skills@8792394ff1b6"   # MIT
    path: .agents/skills/resolve-merge-conflicts
    sha256: 4ebcdd6f0d66d6b1d40bbe0e7df80b13088f20913ad4dbdaf3328c8835978df9
  retro:
    source: "github:mattpocock/skills@a496f5513d4a"
    path: skills/engineering/retro
    sha256: 09c4f9fe72fc5bc8e486a2bbb32dd785ca6264c56a53dd1bf9a334af72586efd
  # repo-conventions: { path: skills/repo-conventions }   # a local shared skill: skills/<name>/SKILL.md here

# Roles: what an agent of the role has. Instructions (role.md, Jinja), setup.sh (installs the
# role's tools) and any other file a role needs stay in roles/<role>/. Agents in workflow.yaml pick a role, a model and settings.
roles:
  developer:
    description: Implements a ticket, fixes review findings, resolves merge conflicts
    skills: [ponytail, ponytail-review, merge-risk, pr, resolve-merge-conflicts, tdd, diagnosing-bugs, principle-test-behavior-not-implementation]
    mcp: {}
  notify:
    description: Tells the owner about a state that needs them
    skills: []
    mcp: {}
  resume:
    description: Moves a ticket that waits for a person to triage or ready after the person comments
    skills: []
    mcp: {}
  retro:
    description: Collects lessons from tickets and merges them into the knowledge base
    skills: [retro]
    mcp: {}
  reviewer:
    description: Reviews a PR at its head and pins the verdict to that head
    skills:
      - ponytail-review           # a name from `skills`
      - merge-risk
      - walkthrough               # the Walkthrough section of the review body
      # - adr-reading: { path: roles/reviewer/skills/adr-reading }      # a role-only local skill
      # - security-review: { source: "github:owner/repo@<sha>", path: skills/security-review, sha256: ... }
    mcp: {}
  dispatcher:
    description: Starts a ready ticket with the developer its size needs, estimating it when it has no size
    skills: []
    mcp: {}
  approver:
    description: Decides whether an approved PR merges automatically or goes to a person
    skills: []
    mcp: {}
  ops:
    description: Runs one engine command and reports its result
    skills: []
    mcp: {}
  router:
    description: Scopes a ticket, sets risk and complexity, or asks, splits, or rejects it
    skills: [to-tickets]
    mcp: {}
    env:
      FACTORY_ISSUES_TOKEN: { required: true, secret: true,
                              description: "GitHub token, Issues read/write on every repository; the router opens per-repository tickets" }

# Agents: a role (above; roles/<role>/: role.md, setup.sh) + a model
# + access + settings. `gate` and `human` have no role.
agents:
  human:          { harness: human }                               # a person; never deployed
  router:         { role: router, model: sonnet, access: read-only }        # judges answers; luna re-asked answered questions (#782)
  dispatcher:     { role: dispatcher, model: luna, access: read-only }
  dev-cheap:      { role: developer, model: luna, access: full }
  dev:            { role: developer, model: sonnet, reasoning: high, access: full }
  dev-strong:     { role: developer, model: sonnet, reasoning: max, access: full }
  reviewer:       { role: reviewer, model: sol, access: read-only }
  reviewer-cheap: { role: reviewer, model: luna, access: read-only }
  approver:       { role: approver, model: luna, access: read-only }
  clerk:          { run: decide, model: luna, access: read-only }  # runs `factory decide`: the node's guards choose
  ops:            { role: ops, model: luna, access: full }   # its nodes declare `writes` to pick their main checkout; output stays read-only
  retro:          { role: retro, model: sonnet, access: full }
  notify:         { role: notify, model: luna, access: read-only }
  resume:         { role: resume, model: luna, access: read-only }

# Environments: where agents run, only the set of checkouts (ADR-0024). A node's `listens` and `writes`
# in workflow.yaml choose its main repository; every other one is a read-only checkout.
environments:
  engine:                         # tickets and PRs of the engine
    repositories:
      - repo: zaharchenko-evgeny/slop-factory
      - repo: zaharchenko-evgeny/slop-eval-factory   # the team repository: its tickets' developer copies write it
    ci: { workflow: quality-gates }   # `ci: failed` = Air workflow_run.failed for this workflow
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com,
              "*.blob.core.windows.net", pypi.org, files.pythonhosted.org, registry.npmjs.org]
    vm: default
    setup: null                   # optional script path, run after the engine's bootstrap; installs the environment's tools
  knowledge:                      # retro: the knowledge base, with the project as evidence
    repositories:
      - repo: zaharchenko-evgeny/slop-eval-factory
      - repo: zaharchenko-evgeny/slop-factory
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com,
              pypi.org, files.pythonhosted.org]
    vm: default
