engine: 1
project: { name: "Slop factory" }
repositories:
  - name: slop-factory
    url: https://github.com/zaharchenko-evgeny/slop-factory
    default_branch: main
    role: primary
branch_pattern: "ez/{ticket}-{slug}"
commit_prefix: "#{ticket} "
tracker:
  adapter: github-issues
  repository: zaharchenko-evgeny/slop-factory
notify:
  github_user: zaharchenko-evgeny
reviews:
  trusted_bots: []
targets:
  air:
    bot_login: jetbrains-air[bot]
    models:
      cheap: codex/gpt-6-luna
      mid: claude/claude-sonnet-5-5[1m]
      strong: claude/claude-sonnet-5-5[1m]
      review: codex/gpt-6-luna
      review_strong: codex/gpt-6.1-sol
models:
  cheap: anthropic/claude-haiku-5-5
  mid: anthropic/claude-sonnet-5-5
  strong: anthropic/claude-sonnet-5-5
  review: anthropic/claude-haiku-5-5
  review_strong: anthropic/claude-sonnet-5-5
roles:
  router: { tier: cheap }
  developer: { tier: mid, tier_high_risk: strong, fallback: mid }
  reviewer:
    tools: read-only
    modes:
      full: { tier: review_strong, fallback: cheap }             # risk low: one reviewer, covers every focus
      behaviour: { tier: review, fallback: cheap }               # risk high
      structure-security: { tier: review_strong, fallback: cheap }  # risk high
      knowledge: { tier: review_strong, fallback: cheap }          # distill PRs only (never required by risk)
  doc-writer: { tier: mid }
  retro: { tier: cheap }
  distill: { tier: mid }
knowledge: { branch: knowledge-inbox, dir: knowledge, distill_branch: knowledge-distill, distill_every_days: 7, agents_md_lines: 150 }
gates:
  ticket_approval: human
  auto_merge: { enabled: true, max_risk: high }
  confirm_external_writes: true
  confirm_external_writes_scope: []
limits:
  concurrent_deliveries: 2
  fix_rounds: 3
  agent_runs_per_ticket: 8
  stale_hours: 2   # recover node: hours in an active stage before a missing waking event counts as a lost run
  stale_command_minutes: 30   # recover command labels with no later outcome
  resume_cap: 3   # comment resumes of a waiting ticket before it stays for a person
  runs_per_day: 20
  environment_repair_attempts: 2
checks:
  - name: doc-references
    stage: pre-review
    mode: blocking
    run: uv run --quiet factory/check_refs.py
  - name: whitespace
    stage: pre-review
    mode: blocking
    run: git diff --check "origin/${FACTORY_BASE:-main}...HEAD"
  - name: setup-scripts-parse
    stage: pre-review
    mode: blocking
    run: for f in roles/*.sh roles/*/setup.sh; do bash -n "$f" || exit 1; done
  - name: shellcheck
    stage: pre-review
    mode: advisory
    requires: uvx
    run: uvx --quiet --from shellcheck-py==0.10.0.1 shellcheck -x roles/*.sh roles/*/setup.sh
  - name: vendored-skills
    stage: pre-review
    mode: blocking
    run: python3 scripts/vendor-skills.py --check
  - name: air-startup
    stage: pre-review
    mode: blocking
    requires: uvx
    run: bash -n .air/cloud/startup.sh && uvx --quiet --from shellcheck-py==0.10.0.1 shellcheck .air/cloud/startup.sh
  - name: state-machine
    stage: pre-review
    mode: blocking
    run: uv run --quiet factory/nodes.py validate && uv run --quiet factory/tests/test_nodes.py && uv run --quiet factory/tests/test_gate.py && uv run --quiet factory/tests/test_github_tracker.py && uv run --quiet factory/tests/test_gate_github.py && uv run --quiet factory/tests/test_vendor_skills.py && uv run --quiet factory/tests/test_air_startup.py && uv run --quiet factory/tests/test_deploy.py && uv run --quiet factory/tests/test_cli.py && uv run --quiet factory/tests/test_config.py && uv run --quiet factory/tests/test_knowledge.py && uv run --quiet factory/tests/test_doctor.py && uv run --quiet factory/cli.py validate && uv run --quiet skills/factory-setup/tests/test_templates.py
