environments:
  default: { repository: main, startup: .air/cloud/startup.sh, secrets: [], domains: [github.com, release-assets.githubusercontent.com], vm: default }
schedules:
  sweep: { cron: "*/10 * * * *" }
  recover: { cron: "0 6,18 * * *" }
nodes:
  human: { triggers: [manual], when: { actor: human }, role: human, outcomes: {} }
  intake: { triggers: ["issues.labeled factory:ready"], role: router, tier: cheap, output: read-only, outcomes: {} }
  implement: { tiers: [cheap, mid], triggers: ["issues.labeled factory:implement-<tier>"], role: developer, output: create-pr, outcomes: {} }
  update: { tiers: [cheap, mid, strong], triggers: ["pull_request.labeled factory:update-<tier>"], role: developer, output: push-to-source, outcomes: {} }
  review: { focuses: [full, behaviour], triggers: ["pull_request.opened", "pull_request.synchronize", "pull_request.labeled factory:rereview-<focus>"], role: reviewer, outcomes: {} }
  off: { enabled: false, triggers: ["issues.labeled factory:x"], role: router, outcomes: {} }
  sweep: { triggers: ["schedule sweep"], role: script, output: read-only, outcomes: {} }
  recover: { triggers: ["schedule recover"], when: { always: true }, role: script, tier: cheap, run: uv run factory/gate.py sweep --stale, output: read-only, outcomes: {} }
