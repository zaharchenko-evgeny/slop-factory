# High risk, both reviewers approve, CI fails after publish: a fix round with
# the CI log, the checks, a re-review by both reviewers, publish again, then
# `approved` once CI passes.
ticket:
  state: in-dev
  pending: [checks]
  vars: { risk: high }
events:
  - checks.passed
  - review_behaviour.done: { verdict: approved, reviewed_sha: a1, risk: high }
  - review_structure_security.done: { verdict: approved, reviewed_sha: a1, risk: high }
  - approve.done: { verdict: needs-human, reasons: [risk is high] }
  - publish.done: { pr_urls: ["https://example.invalid/pr/1"] }
  - ci.failed: { ci: "failed (exit 1)" }
  - fix.done
  - checks.passed
  - review_behaviour.done: { verdict: approved, reviewed_sha: a2, risk: high }
  - review_structure_security.done: { verdict: approved, reviewed_sha: a2, risk: high }
  - approve.done: { verdict: needs-human, reasons: [risk is high] }
  - publish.done: { pr_urls: ["https://example.invalid/pr/1"] }
  - ci.passed
