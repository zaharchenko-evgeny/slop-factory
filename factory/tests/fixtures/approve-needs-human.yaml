# Low risk, the reviewer approves, a hard rule rejects the PR: the approver
# records `needs-human`, publish runs anyway (dry-run), and the ticket waits in `approved`.
ticket:
  state: in-dev
  pending: [checks]
events:
  - checks.passed
  - review_full.done: { verdict: approved, reviewed_sha: a1, risk: low }
  - approve.done: { verdict: needs-human, reasons: ["touches .github/workflows/ci.yml"] }
  - publish.done: { pr_urls: ["https://example.invalid/pr/1"] }
  - ci.passed
