# Invalid: lists where names belong (from, loop.counter, loop.on_exhausted).
version: 1
initial: in-review
vars: { fix_round: { type: int, default: 0 } }
actions: { review: {} }
states:
  in-review: { actor: agent }
  blocked: { actor: human }
transitions:
  - { from: [[in-review]], on: review.done, to: blocked }
  - from: in-review
    on: review.done
    loop: { counter: [fix_round], max: 3, on_exhausted: [blocked] }
    do: review
