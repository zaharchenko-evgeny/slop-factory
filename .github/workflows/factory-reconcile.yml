    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-reconcile

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
