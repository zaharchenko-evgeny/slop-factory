# Generated by `factory deploy` from workflows/nodes.yaml (node `reconcile`). Do not edit.
name: factory-reconcile

on:
  schedule:
    - cron: "7,37 * * * *"
  issues:
    types: [labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted]
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [quality-gates]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx install uv
      - run: uv run --quiet factory/cli.py reconcile
