name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The factory's blocking checks (factory.yaml `checks`), one list for CI and the driver.
  factory-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - run: pipx install uv
      - id: checks
        run: uv run --quiet factory/run_checks.py --mode blocking 2>&1 | tee checks.log; exit "${PIPESTATUS[0]}"
      # No branch protection (private repository): a red main is owned by one ticket.
      - name: Open or reuse the Main is red ticket
        if: failure() && github.event_name == 'push'
        run: |
          check=$(grep -m1 ': fail$' checks.log | cut -d: -f1)
          title="Main is red: ${check:-factory-checks}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$title" --label factory:ready --label risk:low \
              --body "[factory] Blocking check \`${check}\` fails on main at ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Factory-Run: ${GITHUB_RUN_ID}"
          fi
      # A PR green only against an old main must turn red before anyone merges it.
      - name: Re-run on open factory PRs
        if: github.event_name == 'push'
        run: |
          gh pr list --state open --base main --json headRefName --jq '.[].headRefName | select(startswith("ez/"))' |
            while read -r ref; do gh workflow run quality-gates.yml --ref "$ref"; done
  agnix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Scans the whole tree; it picks up AGENTS.md, SKILL.md and roles/**/*.md.
      - run: npx --yes agnix@0.59.3 .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: find . -name setup.sh -not -path './.factory/*' -exec shellcheck -x {} +

  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx run jactionlint==2.3.0 --shellcheck=

  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTERLEAKS_VERSION: 1.9.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - shell: bash
        run: curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" | tar xz betterleaks
      - name: Repository
        run: ./betterleaks dir . --no-banner
      - name: PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./betterleaks git . --no-banner --log-opts="${BASE_SHA}..HEAD"
