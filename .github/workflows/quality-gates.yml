name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The factory's blocking checks (the team descriptor `checks`), one list for CI and the driver.
  factory-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FACTORY_TEAM: factory/tests/fixtures/team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - run: pipx install uv
      # A re-run on a PR head tests it merged with the current main, like the pull_request event does.
      - name: Merge main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: git -c user.name=ci -c user.email=ci@example.invalid merge --no-edit origin/main
      - name: Check documentation references
        run: uv run --quiet factory/check_refs.py
      - id: checks
        run: |
          set -o pipefail
          uv run --quiet --with pyyaml python - <<'PY' 2>&1 | tee checks.log
          import os, shutil, subprocess, sys
          sys.path.insert(0, "factory")
          import config as factory_config
          config = factory_config.load()
          base = os.environ.get("FACTORY_BASE") or config["repositories"][0].get("default_branch", "main")
          for check in config.get("checks", []):
              if check.get("stage", "pre-review") != "pre-review" or check.get("mode") != "blocking":
                  continue
              if check.get("run") == "uv run --quiet factory/check_refs.py":
                  continue  # Run once above; the command also lives in the descriptor.
              if check.get("requires") and not shutil.which(check["requires"]):
                  print(f"{check['name']}: skipped")
                  sys.exit(1)
              result = subprocess.run(["bash", "-c", check["run"]], env={**os.environ, "FACTORY_BASE": base}, text=True, capture_output=True)
              print(f"{check['name']}: {'pass' if result.returncode == 0 else 'fail'}")
              if result.returncode:
                  print(result.stdout + result.stderr, file=sys.stderr)
                  sys.exit(1)
          PY
      - id: agnix
        name: agnix
        run: npx --yes agnix@0.59.3 .
      - id: shellcheck
        name: shellcheck
        run: find . -name setup.sh -not -path './.factory/*' -exec shellcheck -x {} +
      - id: jactionlint
        name: jactionlint
        run: pipx run jactionlint==2.3.0 --shellcheck=
      - id: betterleaks_download
        name: Betterleaks download
        shell: bash
        env:
          BETTERLEAKS_VERSION: 1.9.0
        run: curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" | tar xz betterleaks
      - id: betterleaks_repository
        name: Betterleaks repository
        run: ./betterleaks dir . --no-banner
      - id: betterleaks_diff
        name: Betterleaks PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./betterleaks git . --no-banner --log-opts="${BASE_SHA}..HEAD"
      # No branch protection (private repository): a red main is owned by one ticket.
      - name: Open or reuse the Main is red ticket
        if: failure() && github.event_name == 'push'
        run: |
          check=$(grep -m1 -E '^[A-Za-z0-9_.-]+: fail$' checks.log | cut -d: -f1)
          title="Main is red: ${check:-factory-checks}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$title" --label factory:ready --label risk:low \
              --body "[factory] Blocking check \`${check}\` fails on main at ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Factory-Run: ${GITHUB_RUN_ID}"
          fi
      # Re-test only approved PRs before merge; other branches are updated on their next push.
      - name: Re-run on approved factory PRs
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gh pr list --state open --base main --json headRefName,labels --jq '.[] | select(any(.labels[]; .name == "factory:approved")) | .headRefName' |
            while read -r ref; do
              gh workflow run quality-gates.yml --ref "$ref" 2>/dev/null && continue
              id=$(gh run list --workflow quality-gates.yml --branch "$ref" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$id" ] && gh run rerun "$id"; then continue; fi
              echo "::warning::could not re-run quality-gates on $ref"
            done
      - name: Summarize quality checks
        if: always()
        env:
          AGNIX: ${{ steps.agnix.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          JACTIONLINT: ${{ steps.jactionlint.outcome }}
          BETTERLEAKS_DOWNLOAD: ${{ steps.betterleaks_download.outcome }}
          BETTERLEAKS_REPOSITORY: ${{ steps.betterleaks_repository.outcome }}
          BETTERLEAKS_DIFF: ${{ steps.betterleaks_diff.outcome }}
        run: |
          {
            echo '## Quality checks'
            echo "- agnix: ${AGNIX:-not run}"
            echo "- shellcheck: ${SHELLCHECK:-not run}"
            echo "- jactionlint: ${JACTIONLINT:-not run}"
            echo "- betterleaks: download ${BETTERLEAKS_DOWNLOAD:-not run}, repository ${BETTERLEAKS_REPOSITORY:-not run}, PR diff ${BETTERLEAKS_DIFF:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Air's environment: non-root user, HOME with factory-main (#281), only the domains of the environment plan.
  air-like:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - run: pipx install uv
      - name: Start the domain allowlist proxy
        run: |
          domains=$(uv run --quiet --with pyyaml python -c "import yaml; print(*{d for e in yaml.safe_load(open('workflows/nodes.yaml'))['environments'].values() for d in e.get('domains', [])})")
          touch "/tmp/air-like-denied.log"
          chmod 666 "/tmp/air-like-denied.log"
          # The proxy runs as `nobody`; the container user (uid 1500, not the runner's own uid) may reach only loopback, so direct downloads fail.
          sudo iptables -I OUTPUT 1 -m owner --uid-owner 1500 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner 1500 ! -o lo -j REJECT
          sudo cp -a "$PWD" "/tmp/air-like-repo"
          sudo chown -R 1500 "/tmp/air-like-repo"
          # shellcheck disable=SC2086
          # Run the copy (under /tmp: `nobody` cannot traverse the runner home), detached from the step, and wait until it listens.
          (cd "/tmp/air-like-repo" && setsid nohup sudo -u nobody python3 scripts/allowlist_proxy.py 8888 "/tmp/air-like-denied.log" $domains > "$RUNNER_TEMP/proxy.log" 2>&1 &)
          for _ in $(seq 20); do (echo > /dev/tcp/127.0.0.1/8888) 2>/dev/null && exit 0; sleep 0.5; done
          echo "::error::allowlist proxy did not start: $(cat "$RUNNER_TEMP/proxy.log")"
          exit 1
      - name: Build the image
        run: |
          docker build -t air-like --build-arg UID=1500 - <<'EOF'
          FROM ubuntu:24.04
          ARG UID
          RUN apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 && rm -rf /var/lib/apt/lists/*
          RUN userdel -r ubuntu 2>/dev/null; useradd -m -u "$UID" -d /home/workspace workspace
          EOF
      - name: Run startup.sh as in Air
        run: |
          docker run --rm --network host --user workspace -e HOME=/home/workspace -e REPO=/repo \
            -e FACTORY_TEAM=/repo/factory/tests/fixtures/team \
            -e HTTPS_PROXY=http://127.0.0.1:8888 -e NO_PROXY=localhost,127.0.0.1 \
            -v "/tmp/air-like-repo:/repo" air-like bash /repo/scripts/air-like.sh
      - name: Check for downloads from other hosts
        if: always()
        run: |
          # A direct (non-proxy) download as the container's uid must be rejected.
          for family in -4 -6; do
            if sudo -u '#1500' curl "$family" -sS --max-time 10 -o /dev/null https://example.com 2>/dev/null; then
              echo "::error::direct IPv${family#-} egress is not blocked"
              exit 1
            fi
          done
          if [ -s "/tmp/air-like-denied.log" ]; then
            echo "::error::downloads from hosts outside the environment plan: $(sort -u "/tmp/air-like-denied.log" | tr '\n' ' ')"
            exit 1
          fi
  agnix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Scans the whole tree; it picks up AGENTS.md, SKILL.md and roles/**/*.md.
      - run: npx --yes agnix@0.59.3 .

  # The CI label is the result of every job: it runs last, so the run is about to complete when the label wakes a
  # reviewer or the join, and they read the same result from the workflow runs instead of `pending`.
  ci-label:
    needs: [factory-checks, air-like, agnix]
    if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'ez/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx install uv
      - name: Label the PR with this run's CI result
        env:
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || (contains(needs.*.result, 'skipped') && 'skipped' || 'success')) }}
        run: scripts/ci-state-label.sh
