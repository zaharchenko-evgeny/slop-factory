name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The factory's blocking checks (the team descriptor `checks`), one list for CI and the driver.
  factory-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FACTORY_TEAM: factory/tests/fixtures/team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - run: pipx install uv
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with: { path: ~/.cache/factory, key: factory-tla2tools-v1.7.4 }
      # A re-run on a PR head tests it merged with the current main, like the pull_request event does.
      - name: Merge main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: git -c user.name=ci -c user.email=ci@example.invalid merge --no-edit origin/main
      - name: notify-relay tests
        run: uv run --quiet --project integrations/notify-relay --with pytest pytest integrations/notify-relay/tests
      - name: Check documentation references
        run: uv run --quiet factory/check_refs.py
      # test_slop_fixture_is_migrate_project_output regenerates fixtures/slop from the team commit in its SOURCE file.
      - name: Check out the slop fixture's team commit
        run: |
          fixture=factory/tests/fixtures/slop
          git clone --quiet "$(sed -n 2p "$fixture/SOURCE")" "$RUNNER_TEMP/slop-team"   # SOURCE: commit, then URL
          git -C "$RUNNER_TEMP/slop-team" checkout --quiet --detach "$(sed -n 1p "$fixture/SOURCE")"
          echo "FACTORY_SLOP_TEAM=$RUNNER_TEMP/slop-team" >> "$GITHUB_ENV"
      - id: checks
        run: |
          set -o pipefail
          uv run --quiet --with pyyaml python - <<'PY' 2>&1 | tee checks.log
          import os, shutil, subprocess, sys
          sys.path.insert(0, "factory")
          import config as factory_config
          config = factory_config.load()
          base = os.environ.get("FACTORY_BASE") or config["repositories"][0].get("default_branch", "main")
          for check in config.get("checks", []):
              if check.get("stage", "pre-review") != "pre-review" or check.get("mode") != "blocking":
                  continue
              if check.get("run") == "uv run --quiet factory/check_refs.py":
                  continue  # Run once above; the command also lives in the descriptor.
              if check.get("requires") and not shutil.which(check["requires"]):
                  print(f"{check['name']}: skipped")
                  sys.exit(1)
              result = subprocess.run(["bash", "-c", check["run"]], env={**os.environ, "FACTORY_BASE": base}, text=True, capture_output=True)
              print(f"{check['name']}: {'pass' if result.returncode == 0 else 'fail'}")
              if result.returncode:
                  print(result.stdout + result.stderr, file=sys.stderr)
                  sys.exit(1)
          PY
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with: { path: ~/.npm, key: agnix-npm-cache }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - name: Check YouTrack workflow syntax
        run: node --check factory/factory_plugins/youtrack/comment-wake/comment-wake.js && node factory/tests/test_youtrack_comment_wake.js
      - name: Check the workflow state machine
        run: |
          uv run --quiet factory/cli.py check-workflow factory/tests/fixtures/slop
          uv run --quiet factory/cli.py check-workflow skills/factory-setup/template
      - id: agnix
        name: agnix
        run: scripts/retry-network.sh npx --yes agnix@0.59.3 .
      - id: shellcheck
        name: shellcheck
        run: find . -name setup.sh -not -path './.factory/*' -exec shellcheck -x {} +
      - id: jactionlint
        name: jactionlint
        run: pipx run jactionlint==2.3.0 --shellcheck=
      - id: betterleaks_download
        name: Betterleaks download
        shell: bash
        env:
          BETTERLEAKS_VERSION: 1.9.0
        run: |
          scripts/retry-network.sh curl --retry 3 --retry-all-errors --retry-delay 5 -sSfL -o betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf betterleaks.tar.gz betterleaks
          rm betterleaks.tar.gz
      - id: betterleaks_repository
        name: Betterleaks repository
        run: ./betterleaks dir . --no-banner
      - id: betterleaks_diff
        name: Betterleaks PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./betterleaks git . --no-banner --log-opts="${BASE_SHA}..HEAD"
      # No branch protection (private repository): a red main is owned by one ticket.
      - name: Open or reuse the Main is red ticket
        if: failure() && github.event_name == 'push'
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # A flaky check gets one re-run of the failed jobs; the ticket opens only when the re-run fails too.
          if [ "$RUN_ATTEMPT" -lt 2 ] && gh run rerun "$GITHUB_RUN_ID" --failed; then
            echo "re-running the failed jobs once before opening a ticket"
            exit 0
          fi
          check=$(grep -m1 -E '^[A-Za-z0-9_.-]+: fail$' checks.log | cut -d: -f1)
          title="Main is red: ${check:-factory-checks}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$title" --label factory:ready --label risk:low \
              --body "[factory] Blocking check \`${check}\` fails on main at ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Factory-Run: ${GITHUB_RUN_ID}"
          fi
      # Re-test only approved PRs before merge; other branches are updated on their next push.
      - name: Re-run on approved factory PRs
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gh pr list --state open --base main --json headRefName,labels --jq '.[] | select(any(.labels[]; .name == "factory:approved")) | .headRefName' |
            while read -r ref; do
              gh workflow run quality-gates.yml --ref "$ref" 2>/dev/null && continue
              id=$(gh run list --workflow quality-gates.yml --branch "$ref" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$id" ] && gh run rerun "$id"; then continue; fi
              echo "::warning::could not re-run quality-gates on $ref"
            done
      - name: Summarize quality checks
        if: always()
        env:
          AGNIX: ${{ steps.agnix.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          JACTIONLINT: ${{ steps.jactionlint.outcome }}
          BETTERLEAKS_DOWNLOAD: ${{ steps.betterleaks_download.outcome }}
          BETTERLEAKS_REPOSITORY: ${{ steps.betterleaks_repository.outcome }}
          BETTERLEAKS_DIFF: ${{ steps.betterleaks_diff.outcome }}
        run: |
          {
            echo '## Quality checks'
            echo "- agnix: ${AGNIX:-not run}"
            echo "- shellcheck: ${SHELLCHECK:-not run}"
            echo "- jactionlint: ${JACTIONLINT:-not run}"
            echo "- betterleaks: download ${BETTERLEAKS_DOWNLOAD:-not run}, repository ${BETTERLEAKS_REPOSITORY:-not run}, PR diff ${BETTERLEAKS_DIFF:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Air's environment: non-root user, HOME with factory-main (#281), only the domains of the environment plan.
  agnix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with: { path: ~/.npm, key: agnix-npm-cache }
      # Scans the whole tree; it picks up AGENTS.md, SKILL.md and roles/**/*.md.
      - run: scripts/retry-network.sh npx --yes agnix@0.59.3 .

  # Information for the reviewer, not a required check: mutants of the changed lines that the tests do not catch.
  # The factory counts every check of a head as CI (#1207), so this job never fails: a script error is a warning.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - run: pipx install uv
      - name: Mutate the changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FACTORY_TEAM: factory/tests/fixtures/team
        run: |
          survivors=$(uv run --quiet python scripts/mutation-diff.py --base "$BASE_SHA") ||
            { echo "::warning title=mutation::scripts/mutation-diff.py failed: no mutation result"; exit 0; }
          printf '## Surviving mutants\n```\n%s\n```\n' "$survivors" >> "$GITHUB_STEP_SUMMARY"
