name: ci-state

# Air delivers no event for a successful workflow run (probe on #197), so CI writes its result to the
# factory PR as a label, and the label starts the next node: factory:ci-green starts the reviewers,
# factory:ci-red starts the join (a fix round). Runs from main's copy of this file and checks out no PR code.
on:
  # The job checks out no code, reads no artifact and writes only labels; a fork's ez/* PR gains nothing,
  # because the Air triggers accept only the factory bot's PRs.
  workflow_run: # jactionlint ignore=dangerous-triggers
    workflows: [quality-gates]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  label:
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'ez/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Label the PR with the CI result of its current head
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then echo "no open PR at $SHA (head moved or PR closed): nothing to label"; exit 0; fi
          case "$CONCLUSION" in
            success|neutral) want=factory:ci-green ;;
            cancelled|skipped) echo "conclusion $CONCLUSION: no result"; exit 0 ;;
            *) want=factory:ci-red ;;
          esac
          labels=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
          has_want=false
          has_other=false
          case ",$labels," in *",$want,"*) has_want=true ;; esac
          other=factory:ci-green
          [ "$want" = factory:ci-green ] && other=factory:ci-red
          case ",$labels," in *",$other,"*) has_other=true ;; esac
          previous_sha=$(gh run list --workflow quality-gates.yml --branch "$BRANCH" --limit 100 \
            --json databaseId,headSha,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and .status == \"completed\")][0].headSha // \"\"")
          if [ "$has_want" = true ] && [ "$previous_sha" = "$SHA" ]; then
            if [ "$has_other" = true ]; then gh pr edit "$pr" --remove-label "$other" >/dev/null; fi
            echo "PR #$pr at $SHA already has $want: nothing to change"
            exit 0
          fi
          # Re-adding the same label fires no event; clear a stale result before recording this head.
          if [ "$has_other" = true ] || [ "$has_want" = true ]; then
            gh pr edit "$pr" --remove-label "$other" --remove-label "$want" >/dev/null 2>&1 || true
          fi
          gh pr edit "$pr" --add-label "$want"
          echo "PR #$pr at $SHA: $want"
