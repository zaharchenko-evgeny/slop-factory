# The factory as nodes (ADR-0014). One node = triggers + one condition (`when`) + role, tier,
# environment + outcomes. `uv run factory/nodes.py validate` checks it; `chart` derives the stage chart.
# Stage names are keys of `tracker.stages` in factory.yaml. `from: [none]` = a PR with no stage label.
# An outcome with `ci: [..]` applies only when CI is one of them (`ci: none` makes no transition); otherwise `else` names the outcome applied.
# `ci-independent: true` = the node acts on a PR head without CI; validate requires `ci` in `when` or this flag.
# Nodes marked `enabled: false` need a later slice. `pilot: true` = delivered by the pilot.
environments:
  # `secrets` are names only; `domains` the network allow-list; `vm` the machine size (deploy.py plan).
  default:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []   # gh is jetbrains-air[bot] through the platform's GH_TOKEN
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, pypi.org, files.pythonhosted.org]
    vm: default
adapters:
  ticket: github-issues   # stage, fields, labels, blockers
  pr: github              # state, head, CI, reviews by head SHA
schedules:
  routines: { cron: "0 6 * * *" }
nodes:
  human:
    triggers: ["manual"]
    when: { actor: human }
    role: human
    outcomes:
      ready: { from: [draft, needs-answers, not-actionable, blocked, failed], effects: [{ stage: ready }] }
  intake:
    pilot: true
    triggers: ["issues.labeled factory:ready"]
    when: { stage: ready, blockers: closed }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      proceed: { effects: [{ set-field: risk }, { set-field: complexity }, { label: "factory:implement-<tier>" }, { stage: in-dev }] }
      grill: { effects: [{ comment: questions }, { stage: needs-answers }] }
      split: { effects: [{ create-issues: children }, { stage: split }] }
      not-actionable: { effects: [{ comment: reason }, { stage: not-actionable }] }
      bug: { effects: [{ stage: reproduce }] }
  reproduce:
    enabled: false
    triggers: ["issues.labeled factory:reproduce"]
    when: { stage: reproduce }
    role: developer
    tier: mid
    output: read-only
    outcomes:
      reproduced: { effects: [{ stage: diagnose }] }
      not-reproduced: { effects: [{ comment: questions }, { stage: needs-answers }] }
  diagnose:
    enabled: false
    triggers: ["issues.labeled factory:diagnose"]
    when: { stage: diagnose }
    role: developer
    tier: mid
    output: read-only
    outcomes:
      diagnosed: { effects: [{ comment: diagnosis }, { stage: verify }] }
  verify:
    enabled: false
    triggers: ["issues.labeled factory:verify"]
    when: { stage: verify }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      bug: { effects: [{ stage: in-dev }] }
      intended: { effects: [{ comment: reason }, { stage: not-actionable }] }
  implement:
    pilot: true
    tiers: [cheap, mid, strong]
    triggers: ["issues.labeled factory:implement-<tier>"]
    when: { stage: in-dev }
    role: developer
    output: create-pr
    outcomes:
      done: { effects: [{ unlabel: "factory:implement-*" }, { stage: in-review }] }
      error: { effects: [{ label: "factory:implement-<next tier>" }, { stage: in-dev }] }
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }
      failed: { effects: [{ comment: reason }, { stage: failed }] }
  adopt:
    enabled: false
    ci-independent: true
    triggers: ["pull_request.labeled factory:adopt"]
    when: { stage: none }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      adopted: { from: [none], effects: [{ set-field: risk }, { stage: in-review }] }
  review:
    pilot: true
    focuses: [full, behaviour, structure-security]
    # CI labels the PR when it finishes (.github/workflows/ci-state.yml): reviewers only read green code.
    triggers: ["pull_request.labeled factory:ci-green"]
    when: { stage: in-review, focus: required-by-risk, ci: [green] }
    role: reviewer
    output: read-only
    outcomes:
      approve: { effects: [{ review: approve-at-head }, { join: all-approve }] }
      changes: { effects: [{ review: request-changes-at-head }, { join: all-approve }] }
  join:
    pilot: true
    ci-independent: true
    # A review completes a round; red CI (factory:ci-red) is a fix round with no review.
    triggers: ["pull_request_review.submitted", "pull_request.labeled factory:ci-red"]
    when: { stage: in-review, ci: [green, red] }   # a pending head waits for its CI label
    role: script
    output: read-only
    outcomes:
      changes: { effects: [{ label: "factory:fix-<tier>", "on": pr }, { stage: changes-requested }] }
      approved: { ci: [green], else: changes, effects: [{ stage: approved }] }
      # A handled change request whose author has not decided again: ask them again, move nothing.
      waiting: { from: [in-review], effects: [{ join: all-approve }] }
  fix:
    pilot: true
    tiers: [cheap, mid, strong]
    ci-independent: true
    triggers: ["pull_request.labeled factory:fix-<tier>"]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    role: developer
    output: push-to-source
    outcomes:
      # The command label goes: the next round's join adds it again, and only an added label starts the node.
      # People who requested changes are asked again, after the push, so round 2 waits for them.
      done: { effects: [{ unlabel: "factory:fix-*", "on": pr }, { request-reviewers: changes }, { stage: in-review }] }
      blocked: { from: [changes-requested], effects: [{ comment: reason }, { stage: blocked }] }
  merge:
    enabled: false
    triggers: ["pull_request.labeled factory:merge"]
    when: { stage: approved, round: complete-at-head, ci: green }
    role: script
    output: read-only
    outcomes:
      merged: { from: [approved], effects: [{ merge: match-head }, { stage: merging }] }
      update-or-hold: { from: [approved], effects: [{ comment: reason }, { stage: approved }] }
      fix: { from: [approved], effects: [{ label: "factory:fix-<tier>", "on": pr }, { stage: changes-requested }] }
  merging:
    enabled: false
    ci-independent: true
    triggers: ["workflow_run.completed"]
    when: { stage: merging }
    role: script
    output: read-only
    outcomes:
      merged: { effects: [{ stage: merged }] }
      moved: { effects: [{ stage: approved }] }
  finish:
    pilot: true
    ci-independent: true   # runs after the merge
    triggers: ["pull_request.merged"]
    when: { always: true }   # the script picks each ticket's outcome from its facts (pr-state, children)
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `uv run factory/gate.py sweep`
    run: uv run factory/gate.py sweep
    output: read-only
    outcomes:
      answered: { enabled: false, from: [needs-answers], effects: [{ stage: ready }] }
      children-done: { from: [split], effects: [{ stage: done }] }
      child-failed: { from: [split], effects: [{ stage: blocked }] }
      conflict: { enabled: false, from: [approved], effects: [{ label: "factory:update-cheap", "on": pr }, { stage: changes-requested }] }
      merged: { from: [approved], effects: [{ stage: merged }] }
      retro: { from: [merged], effects: [{ comment: retro }, { stage: done }] }
  routines:
    enabled: false
    triggers: ["schedule routines"]
    when: { due: true }
    role: distill
    output: push-to-new-branch
    outcomes:
      proposed: { effects: [{ comment: report }] }
