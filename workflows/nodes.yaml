# The factory as nodes (ADR-0014). One node = triggers + one condition (`when`) + role, tier,
# environment + outcomes. `uv run factory/nodes.py validate` checks it; `chart` derives the stage chart.
# Stage names are keys of `tracker.stages` in factory.descriptor.yaml. `from: [none]` = a PR with no stage label.
# An outcome with `ci: [..]` applies only when CI is one of them (`ci: none` makes no transition); otherwise `else` names the outcome applied.
# `ci-independent: true` = the node acts on a PR head without CI; validate requires `ci` in `when` or this flag.
# Nodes marked `enabled: false` need a later slice. `pilot: true` = delivered by the pilot.
environments:
  # `secrets` are names only; `domains` the network allow-list; `vm` the machine size (deploy.py plan).
  # `FACTORY_ENV` (the key) tells .air/cloud/startup.sh which skills and tools to install.
  # `read`: intake, review, join, finish. `write`: implement, fix, update. `ops`: the routines.
  read:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []   # gh is jetbrains-air[bot] through the platform's GH_TOKEN
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, pypi.org, files.pythonhosted.org]
    vm: default
  write:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []
    # registry.npmjs.org: `npx agnix` of the acceptance checks
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, pypi.org, files.pythonhosted.org, registry.npmjs.org]
    vm: default
  ops:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, pypi.org, files.pythonhosted.org]
    vm: default
adapters:
  ticket: github-issues   # stage, fields, labels, blockers
  pr: github              # state, head, CI, reviews by head SHA
schedules:
  routines: { cron: "0 6 * * *" }
  recover: { cron: "0 6,18 * * *" }
nodes:
  human:
    triggers: ["manual"]
    when: { actor: human }
    role: human
    outcomes:
      # A person resumes a ticket from every stage but done; the gate reads the stage as the latest stage label added.
      ready: { from: [draft, in-dev, in-review, changes-requested, approved, blocked, needs-answers, split, not-actionable, investigating], effects: [{ stage: ready }] }
  intake:
    env: read
    pilot: true
    triggers: ["issues.labeled factory:ready"]
    when: { stage: ready, blockers: closed }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      proceed: { effects: [{ set-field: risk }, { set-field: complexity }, { label: "factory:implement-<tier>" }, { stage: in-dev }] }
      grill: { effects: [{ comment: questions }, { stage: needs-answers }] }
      split: { effects: [{ create-issues: children }, { stage: split }] }
      not-actionable: { effects: [{ comment: reason }, { stage: not-actionable }] }
      bug: { enabled: false, ticket: 161, effects: [{ stage: investigating }] }   # investigate is not built yet
  investigate:
    env: write
    enabled: false
    ticket: 161
    triggers: ["issues.labeled factory:investigating"]
    when: { stage: investigating }
    role: developer
    tier: mid
    output: read-only
    outcomes:
      bug: { effects: [{ comment: diagnosis }, { stage: in-dev }] }
      intended: { effects: [{ comment: reason }, { stage: not-actionable }] }
      cannot-reproduce: { effects: [{ comment: questions }, { stage: needs-answers }] }
  implement:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    triggers: ["issues.labeled factory:implement-<tier>"]
    when: { stage: in-dev }
    role: developer
    output: create-pr
    outcomes:
      done: { effects: [{ unlabel: "factory:implement-*" }, { stage: in-review }] }
      error: { effects: [{ unlabel: "factory:implement-*" }, { label: "factory:implement-<next tier>" }, { stage: in-dev }] }
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }
      failed: { effects: [{ comment: reason }, { stage: blocked }] }   # one stop stage: the reason is the comment
  adopt:
    env: read
    enabled: false
    ticket: 160
    ci-independent: true
    triggers: ["pull_request.labeled factory:adopt"]
    when: { stage: none }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      adopted: { from: [none], effects: [{ set-field: risk }, { stage: in-review }] }
  review:
    env: read
    pilot: true
    focuses: [full, behaviour, structure-security]
    # CI labels the PR when it finishes (.github/workflows/ci-state.yml): reviewers only read green code.
    triggers: ["pull_request.labeled factory:ci-green"]
    when: { stage: in-review, focus: required-by-risk, ci: [green] }
    role: reviewer
    output: read-only
    outcomes:
      # The posted review starts the join (pull_request_review.submitted); only the join chooses the fix tier.
      approve: { effects: [{ review: approve-at-head }] }
      changes: { effects: [{ review: request-changes-at-head }] }
  join:
    env: read
    pilot: true
    ci-independent: true
    # A review completes a round; red CI (factory:ci-red) is a fix round with no review.
    triggers: ["pull_request_review.submitted", "pull_request.labeled factory:ci-red"]
    when: { stage: in-review, ci: [green, red] }   # a pending head waits for its CI label
    role: script
    output: read-only
    outcomes:
      changes: { effects: [{ label: "factory:fix-<tier>", "on": pr }, { stage: changes-requested }] }
      approved: { ci: [green], else: changes, effects: [{ stage: approved }] }
      # A handled change request whose author has not decided again: ask them again, move nothing.
      waiting: { from: [in-review], effects: [{ join: all-approve }] }
  fix:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    ci-independent: true
    triggers: ["pull_request.labeled factory:fix-<tier>"]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    role: developer
    output: push-to-source
    outcomes:
      # The command label goes: the next round's join adds it again, and only an added label starts the node.
      # People who requested changes are asked again, after the push, so round 2 waits for them.
      done: { effects: [{ unlabel: "factory:fix-*", "on": pr }, { request-reviewers: changes }, { stage: in-review }] }
      blocked: { from: [changes-requested], effects: [{ comment: reason }, { stage: blocked }] }
  update:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    ci-independent: true
    triggers: ["pull_request.labeled factory:update-<tier>"]
    when: { stage: changes-requested }
    role: developer
    output: push-to-source
    outcomes:
      resolved: { effects: [{ unlabel: "factory:update-*", "on": pr }, { stage: in-review }] }
      escalate: { effects: [{ unlabel: "factory:update-*", "on": pr }, { label: "factory:update-<next tier>", "on": pr }, { stage: changes-requested }] }
      unresolvable: { effects: [{ comment: reason }, { stage: blocked }] }
  reopen:
    env: read
    enabled: false
    ticket: 196
    ci-independent: true
    triggers: ["pull_request.synchronize"]
    when: { stage: approved }
    role: script
    output: read-only
    outcomes:
      reopened: { from: [approved], effects: [{ stage: in-review }] }
  merge:
    env: read
    enabled: false
    ticket: 159
    triggers: ["pull_request.labeled factory:merge"]
    when: { stage: approved, round: complete-at-head, ci: green }
    role: script
    output: read-only
    outcomes:
      merged: { from: [approved], effects: [{ merge: match-head }] }
      update-or-hold: { from: [approved], effects: [{ comment: reason }, { stage: approved }] }
      fix: { from: [approved], effects: [{ label: "factory:fix-<tier>", "on": pr }, { stage: changes-requested }] }
  finish:
    env: read
    pilot: true
    ci-independent: true   # runs after the merge
    # A closed or blocked child lets the sweep check its split parent.
    triggers: ["pull_request.merged", "issues.closed", "issues.labeled factory:blocked"]
    when: { always: true }   # the script picks each ticket's outcome from its facts (pr-state, children)
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `uv run factory/gate.py sweep`
    run: uv run factory/gate.py sweep
    output: read-only
    outcomes:
      answered: { enabled: false, ticket: 157, from: [needs-answers], effects: [{ stage: ready }] }
      children-done: { from: [split], effects: [{ stage: done }] }
      child-blocked: { from: [split], effects: [{ comment: reason }, { stage: blocked }] }
      conflict: { from: [approved], effects: [{ label: "factory:update-cheap", "on": pr }, { stage: changes-requested }] }
      merged: { from: [approved], effects: [{ comment: retro }, { stage: done }] }
  recover:
    env: read
    pilot: true
    # Safety net for an Air run that died silently: re-fires the label that woke it (limits.stale_hours).
    triggers: ["schedule recover"]
    when: { always: true }
    role: script
    tier: cheap
    run: uv run factory/gate.py sweep --stale
    output: read-only
    outcomes:
      # The sweep writes these itself: one re-fire per ticket and stage, then blocked.
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }
  routines:
    env: ops
    enabled: false
    ticket: 162
    triggers: ["schedule routines"]
    when: { due: true }
    role: distill
    output: push-to-new-branch
    outcomes:
      proposed: { effects: [{ comment: report }] }
