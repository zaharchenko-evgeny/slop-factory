# The factory as nodes (ADR-0014). One node = triggers + one condition (`when`) + role, tier,
# environment + outcomes. `uv run factory/nodes.py validate` checks it; `chart` derives the stage chart.
# Stage names are keys of `tracker.stages` in factory.descriptor.yaml. `from: [none]` = a PR with no stage label.
# An outcome with `ci: [..]` applies only when CI is one of them (`ci: none` makes no transition); otherwise `else` names the outcome applied.
# `ci-independent: true` = the node acts on a PR head without CI; validate requires `ci` in `when` or this flag.
# Nodes marked `enabled: false` need a later slice. `pilot: true` = delivered by the pilot.
environments:
  # `secrets` are names only; `domains` the network allow-list; `vm` the machine size (deploy.py plan).
  # `FACTORY_ENV` (the key) tells .air/cloud/startup.sh which skills and tools to install.
  # `read`: intake, review, join, finish. `write`: implement, fix, update. `ops`: the routines.
  read:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []   # gh is jetbrains-air[bot] through the platform's GH_TOKEN
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, '*.blob.core.windows.net', pypi.org, files.pythonhosted.org]
    vm: default
  write:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []
    # registry.npmjs.org: `npx agnix` of the acceptance checks
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, '*.blob.core.windows.net', pypi.org, files.pythonhosted.org, registry.npmjs.org]
    vm: default
  ops:
    repository: primary
    startup: .air/cloud/startup.sh
    secrets: []
    domains: [github.com, api.github.com, objects.githubusercontent.com, release-assets.githubusercontent.com, pypi.org, files.pythonhosted.org]
    vm: default
adapters:
  ticket: github-issues   # stage, fields, labels, blockers
  pr: github              # state, head, CI, reviews by head SHA
schedules:
  retro: { cron: "0 2 * * *" }
  distill: { cron: "0 3 * * 1" }
  reconcile: { cron: "17 * * * *" }  # hourly, an Air schedule: GitHub's own schedule never fired in the factory repository
  doctor: { cron: "0 5 * * *" }
nodes:
  human:
    triggers: ["manual"]
    when: { actor: human }
    role: human
    outcomes:
      # A person resumes a ticket from every stage but done; the gate reads the stage as the latest stage label added.
      # `triage` runs the router again (after answers or a scope change); `ready` skips it, or restarts development.
      triage: { from: [draft, ready, in-dev, in-review, changes-requested, approved, blocked, needs-answers, split, not-actionable, investigating], effects: [{ stage: triage }] }
      ready: { from: [draft, triage, in-dev, in-review, changes-requested, approved, blocked, needs-answers, split, not-actionable, investigating], effects: [{ stage: ready }] }
  intake:
    env: read
    pilot: true
    triggers: ["issues.labeled factory:triage"]
    when: { stage: triage }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      proceed: { effects: [{ set-field: risk }, { set-field: complexity }, { stage: ready }] }
      grill: { effects: [{ comment: questions }, { stage: needs-answers }] }
      split: { effects: [{ create-issues: children }, { stage: split }] }
      not-actionable: { effects: [{ comment: reason }, { stage: not-actionable }] }
      bug: { enabled: false, ticket: 161, effects: [{ stage: investigating }] }   # investigate is not built yet
  start:
    env: read
    pilot: true
    triggers: ["issues.labeled factory:ready"]
    when: { stage: ready, blockers: closed }
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `uv run factory/gate.py sweep`
    run: uv run factory/gate.py sweep
    output: read-only
    outcomes:
      # The tier comes from the ticket's `complexity:<size>` label (`defaults.tier` without one); no agent judges.
      started: { from: [ready], effects: [{ label: "factory:implement-<tier>" }, { stage: in-dev }] }
  investigate:
    env: write
    enabled: false
    ticket: 161
    triggers: ["issues.labeled factory:investigating"]
    when: { stage: investigating }
    role: developer
    tier: mid
    output: read-only
    outcomes:
      bug: { effects: [{ comment: diagnosis }, { stage: in-dev }] }
      intended: { effects: [{ comment: reason }, { stage: not-actionable }] }
      cannot-reproduce: { effects: [{ comment: questions }, { stage: needs-answers }] }
  implement:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    triggers: ["issues.labeled factory:implement-<tier>"]
    when: { stage: in-dev }
    role: developer
    output: create-pr
    outcomes:
      done: { effects: [{ unlabel: "factory:implement-*" }, { stage: in-review }] }
      error: { effects: [{ unlabel: "factory:implement-*" }, { label: "factory:implement-<next tier>" }, { stage: in-dev }] }
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }
      failed: { effects: [{ comment: reason }, { stage: blocked }] }   # one stop stage: the reason is the comment
      # A required check fails identically on unchanged `main` in Air: not the ticket's fault. It waits behind a `Main is red in Air` ticket.
      env-broken: { effects: [{ unlabel: "factory:implement-*" }, { park-behind-main-red: failing_check }, { stage: ready }] }
  adopt:
    env: read
    enabled: false
    ticket: 160
    ci-independent: true
    triggers: ["pull_request.labeled factory:adopt"]
    when: { stage: none }
    role: router
    tier: cheap
    output: read-only
    outcomes:
      adopted: { from: [none], effects: [{ set-field: risk }, { stage: in-review }] }
  review:
    env: read
    pilot: true
    focuses: [full, behaviour, structure-security, knowledge]
    # CI labels the PR when it finishes (.github/workflows/quality-gates.yml): reviewers only read green code.
    triggers: ["pull_request.labeled factory:review-<focus>", "pull_request.labeled factory:rereview-<focus>"]
    when: { stage: in-review, focus: required-by-risk, ci: [green] }
    role: reviewer
    output: read-only
    outcomes:
      # The posted review starts the join (pull_request_review.submitted); only the join chooses the fix tier.
      approve: { effects: [{ review: approve-at-head }, { unlabel: "factory:review-<focus>", "on": pr }] }
      changes: { effects: [{ review: request-changes-at-head }, { unlabel: "factory:review-<focus>", "on": pr }] }
  join:
    env: read
    pilot: true
    ci-independent: true
    # A review completes a round; red CI (factory:ci-red) is a fix round with no review.
    triggers: ["pull_request_review.submitted", "pull_request.labeled factory:ci-red"]
    when: { stage: in-review, ci: [green, red] }   # a pending head waits for its CI label
    role: script
    output: read-only
    outcomes:
      changes: { effects: [{ label: "factory:fix-<tier>", "on": pr }, { stage: changes-requested }] }
      approved: { ci: [green], else: changes, effects: [{ stage: approved }] }
      # A handled change request whose author has not decided again: ask them again, move nothing.
      waiting: { from: [in-review], effects: [{ join: all-approve }] }
  fix:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    ci-independent: true
    triggers: ["pull_request.labeled factory:fix-<tier>"]
    when: { stage: changes-requested, round: complete, fix-rounds: below-cap }
    role: developer
    output: push-to-source
    outcomes:
      # The command label goes: the next round's join adds it again, and only an added label starts the node.
      # People who requested changes are asked again, after the push, so round 2 waits for them.
      done: { effects: [{ unlabel: "factory:fix-*", "on": pr }, { request-reviewers: changes }, { stage: in-review }] }
      blocked: { from: [changes-requested], effects: [{ comment: reason }, { stage: blocked }] }
      env-broken: { from: [changes-requested], effects: [{ unlabel: "factory:fix-*", "on": pr }, { park-behind-main-red: failing_check }, { stage: ready }] }
      # A stale or duplicate fix label: no blocking finding, red CI or conflict for the head. The join reruns.
      nothing-to-fix: { from: [changes-requested], effects: [{ unlabel: "factory:fix-*", "on": pr }, { join: all-approve }, { stage: in-review }] }
  update:
    env: write
    pilot: true
    tiers: [cheap, mid, strong]
    ci-independent: true
    triggers: ["pull_request.labeled factory:update-<tier>"]
    when: { stage: changes-requested }
    role: developer
    output: push-to-source
    outcomes:
      resolved: { effects: [{ unlabel: "factory:update-*", "on": pr }, { stage: in-review }] }
      escalate: { effects: [{ unlabel: "factory:update-*", "on": pr }, { label: "factory:update-<next tier>", "on": pr }, { stage: changes-requested }] }
      unresolvable: { effects: [{ unlabel: "factory:update-*", "on": pr }, { comment: reason }, { stage: blocked }] }
  reopen:
    env: read
    pilot: true
    ci-independent: true
    triggers: ["pull_request.synchronize", "pull_request.labeled factory:ci-red"]
    when: { stage: approved }
    role: script
    output: read-only
    outcomes:
      reopened: { from: [approved], effects: [{ stage: in-review }] }
  merge:
    env: read
    pilot: true
    # No agent judges: the sweep merges only when gate.merge_decision holds. `finish` takes over on `pull_request.merged`.
    triggers: ["issues.labeled factory:approved", "pull_request.labeled factory:ci-green"]
    when: { stage: approved, round: complete-at-head, ci: green }
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `uv run factory/gate.py sweep`
    run: uv run factory/gate.py sweep
    output: read-only
    outcomes:
      merged: { from: [approved], effects: [{ merge: match-head }] }
      # Behind main: CI reruns and its `ci-green` wakes `merge` again.
      updated: { from: [approved], effects: [{ update-branch: match-head }] }
      waiting: { from: [approved], effects: [{ comment: reason, "on": pr }] }
  finish:
    env: read
    pilot: true
    ci-independent: true   # runs after the merge
    # A closed or blocked child lets the sweep check its split parent.
    triggers: ["pull_request.merged", "issues.closed", "issues.labeled factory:blocked", "issues.comment"]
    when: { always: true }   # the script picks each ticket's outcome from its facts (pr-state, children)
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `uv run factory/gate.py sweep`
    run: uv run factory/gate.py sweep
    output: read-only
    outcomes:
      answered: { from: [needs-answers], effects: [{ stage: triage }] }
      children-done: { from: [split], effects: [{ stage: done }] }
      child-blocked: { from: [split], effects: [{ comment: reason }, { stage: blocked }] }
      conflict: { from: [approved], effects: [{ label: "factory:update-cheap", "on": pr }, { stage: changes-requested }] }
      merged: { from: [approved], effects: [{ stage: done }] }
  notify:
    env: ops
    pilot: true
    triggers: ["issues.labeled factory:blocked", "issues.labeled factory:needs-answers"]
    when: { stage: [blocked, needs-answers] }
    role: script
    tier: cheap
    run: uv run factory/cli.py notify --issue <issue number from the trigger payload>
    output: read-only
    outcomes:
      notified: { from: [blocked, needs-answers] }
  recover:
    env: read
    # No automation: the hourly reconciler replaced it. Only `gate.py sweep --stale`, run by a person, still applies this outcome.
    runner: manual
    routine: true
    triggers: ["manual"]
    when: { always: true }
    role: script
    tier: cheap
    run: uv run factory/gate.py sweep --stale
    output: read-only
    outcomes:
      blocked: { effects: [{ comment: reason }, { stage: blocked }] }
  reconcile:
    env: ops
    # The hourly stuck-node finder: `factory reconcile` re-fires the waking label of a step with no outcome after
    # `limits.run_timeout_minutes` (`timeout_minutes` on a node overrides it), then blocks the ticket on a second miss.
    # A schedule only: one pass reads every active ticket, so waking it on each label change or review exhausted the
    # GitHub API budget during label bursts (#387). Events stay the fast path; this pass only catches a lost wake.
    routine: true
    triggers: ["schedule reconcile"]
    ci-independent: true
    when: { always: true }
    role: script
    tier: cheap   # Air automation model; it does no work: the automation runs `factory reconcile`
    run: uv run factory/cli.py reconcile
    output: read-only
    outcomes:
      reconciled: {}
  # `factory doctor` probes permissions and tools of the environment it runs in; one node per environment (read, write, ops)
  # because an automation belongs to one environment. It changes no ticket: probe failures open `Doctor:` tickets itself.
  doctor:
    env: read
    routine: true  # outside any ticket, and not a sweep step
    triggers: ["schedule doctor"]
    when: { always: true }
    role: script
    tier: cheap
    run: uv run factory/cli.py doctor
    output: read-only
    outcomes:
      probed: {}
  doctor-write:
    env: write
    routine: true
    triggers: ["schedule doctor"]
    when: { always: true }
    role: script
    tier: cheap
    run: uv run factory/cli.py doctor
    output: read-only
    outcomes:
      probed: {}
  doctor-ops:
    env: ops
    routine: true
    triggers: ["schedule doctor"]
    when: { always: true }
    role: script
    tier: cheap
    run: uv run factory/cli.py doctor
    output: read-only
    outcomes:
      probed: {}
  # Routines (ADR-0015): outside any ticket. `factory/knowledge.py` holds the entry and PR plans the roles follow.
  retro:
    env: ops
    routine: true  # outside any ticket: the gate matches it without tracker facts
    triggers: ["schedule retro"]
    when: { always: true }
    role: retro
    output: as-instructed  # the role pushes to the reusable source branch and keeps one open PR into `knowledge.branch` (knowledge.inbox_pr_action)
    outcomes:
      recorded: {}
  distill:
    env: ops
    routine: true  # outside any ticket: the gate matches it without tracker facts
    triggers: ["schedule distill"]
    when: { always: true }
    role: distill
    output: push-to-new-branch
    outcomes:
      proposed: {}
