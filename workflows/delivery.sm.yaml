# Delivery state chart as data (docs/statechart.md, ADR-0013). `factory/sm.py validate` checks it and
# `sm.py simulate` replays events against it. The tracker label is the only state; each event starts
# one step. The previous fork/loop machine is workflows/delivery.v1.sm.yaml until the local driver moves.
#
# - `states`: each has the tracker stage label (factory.yaml `tracker.stages`); `final` has no exit.
# - `events`: each has a `source` (issue_label, pr_label, pr_synchronize, pr_review, pr_closed, ci,
#   schedule) and, for the label sources, the `label`. Payload fields are read as `event.<field>`.
# - `commands`: PR labels that start a role. `review:<focus>` expands over `focuses`. Exactly one
#   event consumes each (the one declared with that label and used by transitions).
# - `transitions`: first match in file order wins. Keys: from, event, if (guard over vars and
#   `event.*`; the JSONata subset of factory/guards.py), set, inc, labels (command labels applied),
#   to (default: stay), human (a person makes it; `human_transitions` lists the allowed ones).
#   The join and the fix-round bound are guards over vars, not engine constructs.
version: 2
initial: draft
human_transitions:
  - { from: draft, to: ready }
  - { from: blocked, to: ready }
  - { from: failed, to: ready }
commands: [factory:implement, factory:fix, factory:document, factory:approve, "review:<focus>"]
focuses: [full, behaviour, structure-security]

vars:
  fix_round: { type: int, default: 0 }
  max_rounds: { type: int, default: 3 }    # = factory.yaml limits.fix_rounds (validate checks it)
  resumes: { type: int, default: 0 }
  resume_cap: { type: int, default: 3 }    # = factory.yaml limits.resume_cap
  risk: { type: string, default: "low" }   # sticky: the join never lowers it
  docs_impact: { type: string, default: "no" }   # sticky: stays yes once any focus reports it
  approval: { type: string, default: "" }  # the approver's verdict for the current review round
  intent: { type: string, default: "" }    # review | approve: applied by dispatch on the matching push
  full_blocks: { type: bool, default: false }
  behaviour_blocks: { type: bool, default: false }
  security_blocks: { type: bool, default: false }
  human_pending: { type: bool, default: false }   # a human review asked for changes outside `approved`

states:
  draft: { label: "factory:draft" }
  ready: { label: "factory:ready" }
  in-dev: { label: "factory:in-dev" }
  in-review: { label: "factory:in-review" }
  changes-requested: { label: "factory:changes-requested" }
  approved: { label: "factory:approved" }
  merged: { label: "factory:merged" }
  done: { label: "factory:done", final: true }
  blocked: { label: "factory:blocked" }
  failed: { label: "factory:failed" }

events:
  human_ready: { source: issue_label, label: "factory:ready" }
  intake: { source: issue_label, label: "factory:ready" }    # result: wait | blocked | start
  implement: { source: pr_label, label: "factory:implement" }   # result: done | blocked | checks-failed
  fix: { source: pr_label, label: "factory:fix" }
  document: { source: pr_label, label: "factory:document" }
  approve: { source: pr_label, label: "factory:approve" }       # verdict: the approver's verdict
  review_full: { source: pr_label, label: "review:full" }
  review_behaviour: { source: pr_label, label: "review:behaviour" }
  review_structure_security: { source: pr_label, label: "review:structure-security" }
  dispatch: { source: pr_synchronize }       # expected: the new head equals the intent's head
  join: { source: pr_review }                # a reviewer's verdict marker: missing, blocks, risk, ...
  human_review: { source: pr_review }        # a person requested changes
  ci: { source: ci }                         # state: passed | pending | failed
  closed: { source: pr_closed }              # merged: every ticket PR merged
  sweep_resume: { source: schedule }         # actionable: a trusted actionable comment
  sweep_intent: { source: schedule }         # an intent older than intent_ttl, head differs
  sweep_lease: { source: schedule }          # a lease older than lease_ttl (the step crashed)
  sweep_retro: { source: schedule }

transitions:
  - { from: [draft, blocked, failed], event: human_ready, human: true, to: ready }
  - { from: ready, event: intake, if: 'event.result = "wait"' }
  - { from: ready, event: intake, if: 'event.result = "blocked"', to: blocked }
  - { from: ready, event: intake, if: 'event.result = "start"', set: { risk: event.risk }, labels: [factory:implement], to: in-dev }

  - { from: in-dev, event: implement, if: 'event.result != "done"', to: blocked }
  - { from: in-dev, event: implement, set: { intent: '"review"' } }
  - { from: changes-requested, event: fix, if: 'event.result != "done"', to: blocked }
  - { from: changes-requested, event: fix, set: { intent: '"review"' } }

  # dispatch applies the intent when the push matches it: the fork is the set of review labels.
  - { from: in-dev, event: dispatch, if: 'intent = "review" and event.expected = true and risk = "high"', set: { intent: '""' }, labels: ["review:behaviour", "review:structure-security"], to: in-review }
  - { from: in-dev, event: dispatch, if: 'intent = "review" and event.expected = true', set: { intent: '""' }, labels: ["review:full"], to: in-review }
  # A re-review gets the focuses that blocked; none blocked (a CI fix round): every focus of the risk.
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true and behaviour_blocks = true and security_blocks = true', set: { intent: '""' }, labels: ["review:behaviour", "review:structure-security"], to: in-review }
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true and behaviour_blocks = true', set: { intent: '""' }, labels: ["review:behaviour"], to: in-review }
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true and security_blocks = true', set: { intent: '""' }, labels: ["review:structure-security"], to: in-review }
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true and full_blocks = true', set: { intent: '""' }, labels: ["review:full"], to: in-review }
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true and risk = "high"', set: { intent: '""' }, labels: ["review:behaviour", "review:structure-security"], to: in-review }
  - { from: changes-requested, event: dispatch, if: 'intent = "review" and event.expected = true', set: { intent: '""' }, labels: ["review:full"], to: in-review }
  - { from: in-review, event: dispatch, if: 'intent = "approve" and event.expected = true', set: { intent: '""' }, labels: [factory:approve] }
  # A push nobody expected starts a new round for the ticket's risk.
  - { from: [in-review, approved], event: dispatch, if: 'event.expected = false and risk = "high"', set: { approval: '""' }, labels: ["review:behaviour", "review:structure-security"], to: in-review }
  - { from: [in-review, approved], event: dispatch, if: 'event.expected = false', set: { approval: '""' }, labels: ["review:full"], to: in-review }

  # Reviewers post a verdict marker; the join decides when none is missing.
  - { from: in-review, event: [review_full, review_behaviour, review_structure_security] }
  - { from: in-review, event: join, if: 'event.missing > 0' }
  - { from: in-review, event: join, if: 'event.blocks = true and (event.same_ids = true or fix_round >= max_rounds)', to: blocked }
  # risk is sticky: a join that sees high (now or earlier) sets it high; a lower report never lowers it.
  - { from: in-review, event: join, if: 'event.blocks = true and (event.risk = "high" or risk = "high")', set: { risk: '"high"', approval: '""', full_blocks: event.full_blocks, behaviour_blocks: event.behaviour_blocks, security_blocks: event.security_blocks }, inc: [fix_round], labels: [factory:fix], to: changes-requested }
  - { from: in-review, event: join, if: 'event.blocks = true', set: { approval: '""', full_blocks: event.full_blocks, behaviour_blocks: event.behaviour_blocks, security_blocks: event.security_blocks }, inc: [fix_round], labels: [factory:fix], to: changes-requested }
  # A pending human review becomes a fix round at the join or when the ticket would enter approved (problem 23).
  - { from: in-review, event: join, if: 'human_pending = true and fix_round >= max_rounds', to: blocked }
  - { from: in-review, event: join, if: 'human_pending = true', set: { human_pending: false, approval: '""' }, inc: [fix_round], labels: [factory:fix], to: changes-requested }
  - { from: in-review, event: join, if: '(event.docs_impact = "yes" or docs_impact = "yes") and (event.risk = "high" or risk = "high")', set: { risk: '"high"', docs_impact: '"yes"', full_blocks: false, behaviour_blocks: false, security_blocks: false }, labels: [factory:document] }
  - { from: in-review, event: join, if: 'event.docs_impact = "yes" or docs_impact = "yes"', set: { docs_impact: '"yes"', full_blocks: false, behaviour_blocks: false, security_blocks: false }, labels: [factory:document] }
  - { from: in-review, event: join, if: 'event.risk = "high" or risk = "high"', set: { risk: '"high"', full_blocks: false, behaviour_blocks: false, security_blocks: false }, labels: [factory:approve] }
  - { from: in-review, event: join, set: { full_blocks: false, behaviour_blocks: false, security_blocks: false }, labels: [factory:approve] }

  - { from: in-review, event: document, if: 'event.result != "done"', to: blocked }
  - { from: in-review, event: document, set: { intent: '"approve"' } }
  - { from: in-review, event: approve, set: { approval: event.verdict } }

  # Every ci transition needs the approver's verdict for the round (problem 19).
  - { from: in-review, event: ci, if: 'approval != "" and human_pending = true and fix_round >= max_rounds', to: blocked }
  - { from: in-review, event: ci, if: 'approval != "" and human_pending = true', set: { human_pending: false, approval: '""' }, inc: [fix_round], labels: [factory:fix], to: changes-requested }
  - { from: in-review, event: ci, if: 'approval != "" and event.state = "failed" and fix_round >= max_rounds', to: blocked }
  - { from: in-review, event: ci, if: 'approval != "" and event.state = "failed"', set: { approval: '""' }, inc: [fix_round], labels: [factory:fix], to: changes-requested }
  - { from: in-review, event: ci, if: 'approval != ""', to: approved }

  - { from: [in-dev, in-review, changes-requested], event: human_review, set: { human_pending: true } }
  - { from: approved, event: human_review, if: 'fix_round >= max_rounds', to: blocked }
  - { from: approved, event: human_review, set: { approval: '""' }, inc: [fix_round], labels: [factory:fix], to: changes-requested }

  # The PR closed in any state that has one (problem 25).
  - { from: [in-dev, in-review, changes-requested, approved], event: closed, if: 'event.merged = true', to: merged }
  - { from: [in-dev, in-review, changes-requested, approved], event: closed, to: blocked }

  - { from: [in-dev, changes-requested], event: sweep_intent, if: 'intent != ""', to: blocked }
  - { from: [ready, in-dev, in-review, changes-requested], event: sweep_lease, to: failed }
  - { from: blocked, event: sweep_resume, if: 'event.actionable = true and resumes < resume_cap', inc: [resumes], to: ready }
  - { from: merged, event: sweep_retro, to: done }
