# What every team shares (ADR-0015). A team descriptor overrides it key by key, one level deep.
branch_pattern: "ez/{ticket}-{slug}"
commit_prefix: "#{ticket} "
# The settings repository every Air environment clones as the team root; empty: the run uses the engine root.
team_repository: ""

tracker:
  # Stage → label. Exactly one stage label is set on an issue at a time.
  stages:
    draft: factory:draft
    triage: factory:triage
    ready: factory:ready
    in-dev: factory:in-dev
    in-review: factory:in-review
    changes-requested: factory:changes-requested
    approved: factory:approved
    done: factory:done
    blocked: factory:blocked
    needs-answers: factory:needs-answers
    split: factory:split
    not-actionable: factory:not-actionable
    investigating: factory:investigating
  stage_kinds:
    draft: waiting
    triage: active
    ready: active
    in-dev: active
    in-review: active
    changes-requested: active
    approved: active
    split: active
    needs-answers: waiting
    blocked: waiting
    investigating: waiting
    done: final
    not-actionable: final
  # The map issue; its sub-issues give the frontier order.
  map_label: factory:map
  review_trigger: factory:review
  risk_labels: { low: "risk:low", high: "risk:high" }
  docs_impact_label: docs-impact
  bot_logins: []
  hold_label: factory:hold
  # PR facts the GitHub adapter reads from a PR label (ci-sync labels the PR from its checks).
  pr_fact_labels: { ci-green: factory:ci-green, ci-red: factory:ci-red }
  # Command labels the engine writes (factory/vocab.py); a factory.project.yaml declares its own `commands`.
  commands:
    implement-<tier>: { label: factory:implement-<tier> }
    fix-<tier>: { pr_label: factory:fix-<tier> }
    update-<tier>: { pr_label: factory:update-<tier> }
    review-<focus>: { pr_label: factory:review-<focus> }
    rereview-<focus>: { pr_label: factory:rereview-<focus> }
  # Set while a ticket or PR waits for a person.
  needs_human_label: factory:needs-human
  # A ticket with lesson comments retro has not collected yet (ADR-0021).
  lesson_label: factory:lesson
  # A tracker-side rule adds it to an item with a new comment; the comment node removes it (ADR-0023, plugin `comments`).
  comment_label: factory:comment
# Engine plugins to turn on (ADR-0026; `modules:` is the ADR-0025 alias). `comments`: @factory:<agent> mentions,
# agent asks and the comment node. Systems, surfaces and agent runners turn on implicitly.
plugins: []
# The tier `start` gives a ticket without a `complexity:<size>` label.
defaults: { tier: mid }
gates:
  auto_merge: { enabled: true, max_risk: high }
limits:
  remind_after_hours: 24
  comment_runs_per_day: 50   # runs of the `comment` node per day; they do not count against `runs_per_day`
  mention_hops: 3   # asks (`factory end ask`) per ticket; a reply cannot ask (module `comments`)
  generated_paths:
    - factory/tests/fixtures/deploy/air-plan.json
    - factory/tests/fixtures/slop/**
    - docs/statechart.md
    - docs/statechart-proposed.md
    - skills/factory-setup/templates/**
    - skills/vendor/**
    - engine/template-v1/roles/**
    - engine/template-v1/skills/**
    - engine/template-v1/workflows/delivery.md
    - engine/template-v1/workflows/delivery.yaml
# Label colors (GitHub hex) the deploy and the gate give a label by its role, not by its name, so a team's renamed or
# added labels still get one. `stages` is keyed by the stage name in `tracker.stages`, then `stage_kinds` by
# `tracker.stage_kinds`. A team overrides single labels under `overrides` (`{factory:blocked: "000000"}`); a label
# with no color here is created with a random one and never recolored.
labels:
  colors:
    stages:
      draft: cfd3d7
      triage: d4c5f9
      ready: c2e0c6
      in-dev: 1d76db
      in-review: 5319e7
      changes-requested: e99695
      approved: 0e8a16
      done: ededed
      not-actionable: ededed
      split: bfdadc
      needs-answers: fbca04
      investigating: fbca04
      blocked: b60205
    stage_kinds: { waiting: fbca04, active: 1d76db, final: ededed }
    risk: { low: e6f4ea, high: f9d0c4 }
    pr_facts: { ci-green: 2da44e, ci-red: d73a4a }
    groups: { command: c5def5, complexity: fbca04, needs-human: d93f0b, map: "000000" }
  overrides: {}
