# {{PROJECT_NAME}} team descriptor (ADR-0015). Roles and workflows read every
# repository, tracker, model name from here; engine/defaults.yaml holds what teams share.
engine: 1

project: { name: "{{PROJECT_NAME}} factory" }

repositories:
{{REPOSITORIES}}

branch_pattern: "{{BRANCH_PREFIX}}/{ticket}-{slug}"
commit_prefix: "#{ticket} "

tracker:
  adapter: github-issues
  repository: {{TRACKER_REPOSITORY}}

notify:
  github_user: {{NOTIFY_GITHUB_USER}}

# Bots other than targets.air.bot_login whose APPROVED / CHANGES_REQUESTED reviews count in a round.
reviews:
  trusted_bots: []

targets:
{{AIR_TARGET}}

# Model tiers (design §10a). Escalate one tier only after a failure.
models:
  cheap: {{MODEL_CHEAP}}
  mid: {{MODEL_MID}}
  strong: {{MODEL_STRONG}}
  # Reviewers run on a different model family from the developer when one is available.
  review: {{MODEL_REVIEW}}
{{REVIEW_STRONG_NOTE}}
  review_strong: {{MODEL_REVIEW_STRONG}}

roles:
  router: { tier: cheap }
  # `fallback` reruns the developer once, in its resumed session, after a malformed handoff.
  developer: { tier: mid, tier_high_risk: strong, fallback: mid }
  # One entry per reviewer focus (an action mode in the node workflow).
  # `fallback` reruns the same focus once when the reviewer's output has no valid handoff.
  reviewer:
    tools: read-only
    modes:
      full: { tier: review_strong, fallback: cheap }             # risk low: one reviewer, covers every focus
      behaviour: { tier: review, fallback: cheap }               # risk high
      structure-security: { tier: review_strong, fallback: cheap }  # risk high
      knowledge: { tier: review_strong, fallback: cheap }          # distill PRs only (never required by risk)
  # Runs when a reviewer reports docs_impact.
  doc-writer: { tier: mid }
  # Records the run on the knowledge branch after the merge.
  retro: { tier: cheap }
  # Weekly, outside any ticket: merges the knowledge inbox into `knowledge/` as one PR.
  distill: { tier: mid }

# Retro entries (design §11, ADR-0007): pushed to `branch` under `<dir>/<repo>/`,
# never to a default branch. The distill runs every
# `distill_every_days`) opens one PR from `<distill_branch>-<date>` to the default branch with the
# entries merged into `<dir>/` and listed in `<dir>/distilled.txt`.
knowledge: { branch: knowledge-inbox, dir: knowledge, distill_branch: knowledge-distill, distill_every_days: 7, agents_md_lines: 150 }

gates:
  ticket_approval: human
  # The `merge` node merges an approved PR at risk <= `max_risk`; `enabled: false` restores human merging.
  auto_merge: { enabled: true, max_risk: high }
  # Until the factory gates are live, the listed external writes are shown to
  # the user and wait for approval. Issue and PR text, comments and label
  # changes are auto-approved; merges follow `auto_merge`.
  confirm_external_writes: true
  confirm_external_writes_scope: []

limits:
  concurrent_deliveries: 2
  fix_rounds: 3
  # Air spend guard (gate.check refuses, the sweep blocks): implement, fix and update runs per ticket.
  agent_runs_per_ticket: 8
  stale_hours: 2   # `gate.py sweep --stale`: hours in an active stage before a missing waking event counts as a lost run
  stale_command_minutes: 30   # `gate.py sweep --stale`: command labels with no later outcome
  run_timeout_minutes: 30   # `factory reconcile`: minutes a step may lack its outcome before its waking label is re-fired
  resume_cap: 3   # comment resumes of a waiting ticket before it stays for a person
  runs_per_day: 20
  environment_repair_attempts: 2

# Pre-review checks, run from the ticket worktree. Non-zero exit = failure.
# `requires: <command>`: when the command is missing the check reports `skipped`.
{{CHECKS_NOTE}}
checks:
  - name: doc-references
    stage: pre-review
    mode: blocking
    run: uv run --quiet factory/check_refs.py
  - name: whitespace
    stage: pre-review
    mode: blocking
    run: git diff --check "origin/${FACTORY_BASE:-main}...HEAD"
  - name: setup-scripts-parse
    stage: pre-review
    mode: blocking
    run: for f in roles/*.sh roles/*/setup.sh; do bash -n "$f" || exit 1; done
  - name: shellcheck
    stage: pre-review
    mode: advisory
    requires: uvx
    run: uvx --quiet --from shellcheck-py==0.10.0.1 shellcheck -x roles/*.sh roles/*/setup.sh
{{PROJECT_CHECKS}}
