# {{PROJECT_NAME}} software factory. Roles and workflows read every
# repository, tracker, model and harness name from this file (design §2).
version: 1

repositories:
{{REPOSITORIES}}

branch_pattern: "{{BRANCH_PREFIX}}/{ticket}-{slug}"
commit_prefix: "#{ticket} "

tracker:
  adapter: github-issues
  repository: {{TRACKER_REPOSITORY}}
  # Stage → label. Exactly one stage label is set on an issue at a time.
  stages:
    draft: factory:draft
    ready: factory:ready
    in-dev: factory:in-dev
    in-review: factory:in-review
    changes-requested: factory:changes-requested
    approved: factory:approved
    merged: factory:merged
    done: factory:done
    blocked: factory:blocked
    failed: factory:failed
  # The map issue; its sub-issues give the frontier order.
  map_label: factory:map
  review_trigger: factory:review
  risk_labels: { low: "risk:low", high: "risk:high" }
  docs_impact_label: docs-impact

channels: [local]

# Event detectors (drive.py loop): external event of the machine → detector, a
# built-in name or `{ run: <bash> }` (exit 0 fires it, stdout an optional JSON
# payload, $FACTORY_TICKET the ticket). An event with no detector is never fired.
events:
  pr.merged: github-pr-merged

targets:
  local:
    harness: pi
    skill: .agents/skills/factory-delivery
    run_dir: .factory/runs      # handoffs per ticket, git-ignored
    worktree_dir: .factory/worktrees
    # Claude access of role calls: `env` (the caller's ANTHROPIC_API_KEY) or `central` (the JetBrains
    # Central proxy via `jbcentral`, no key; factory/model_access.py). The Air target does not use this.
    model_access: {{MODEL_ACCESS}}
    # launchd job for `drive.py loop --once` (factory/schedule_local.py); `path` is the PATH the jobs need.
    schedule:
      label: {{SCHEDULE_LABEL}}
      interval: 10m
      path: $HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
      # Env var → macOS Keychain service, read by the job at run time (names only, never values);
      # ignored with model_access: central.
      env_from_keychain:{{SCHEDULE_KEYCHAIN}}

# Model tiers (design §10a). Escalate one tier only after a failure.
models:
  cheap: {{MODEL_CHEAP}}
  mid: {{MODEL_MID}}
  strong: {{MODEL_STRONG}}
  # Reviewers run on a different model family from the developer when one is available.
  review: {{MODEL_REVIEW}}
{{REVIEW_STRONG_NOTE}}
  review_strong: {{MODEL_REVIEW_STRONG}}

roles:
  # `harness` (default: `targets.local.harness`, then pi): one of the harnesses in
  # skills/factory-setup/references/harnesses.md. Model ids stay per role.
  router: { harness: pi, tier: cheap }
  # `fallback` reruns the developer once, in its resumed session, after a malformed handoff.
  developer: { harness: pi, tier: mid, tier_high_risk: strong, fallback: mid }
  # One entry per reviewer focus (an action mode in workflows/delivery.sm.yaml).
  # `fallback` reruns the same focus once when the reviewer's output has no valid handoff.
  reviewer:
    harness: pi
    tools: read-only
    modes:
      full: { tier: review, fallback: cheap }                    # risk low: one reviewer
      behaviour: { tier: review, fallback: cheap }               # risk high
      structure-security: { tier: review_strong, fallback: cheap }  # risk high
  # Runs when a reviewer reports docs_impact, before the approver (workflows/delivery.sm.yaml `document`).
  doc-writer: { harness: pi, tier: mid }
  # Records the run on the knowledge branch after the merge (workflows/delivery.sm.yaml `retro`).
  retro: { harness: pi, tier: cheap }
  # Weekly, outside any ticket: merges the knowledge inbox into `knowledge/` as one PR (`drive.py distill`).
  distill: { harness: pi, tier: mid }
  # Auto-approval (design §8): `tier` is the soft judgment's model, run by decisions-kit
  # `decide` with `engine`. Dry-run records the verdict only; a human still merges.
  approver: { harness: pi, tier: cheap, engine: {{DECISIONS_ENGINE}}, dry_run: true }

# Retro entries (design §11, ADR-0007): pushed to `branch` under `<dir>/<repo>/`,
# never to a default branch. The distill (`drive.py distill`, run by `drive.py loop` every
# `distill_every_days`) opens one PR from `<distill_branch>-<date>` to the default branch with the
# entries merged into `<dir>/` and listed in `<dir>/distilled.txt`.
knowledge: { branch: knowledge-inbox, dir: knowledge, distill_branch: knowledge-distill, distill_every_days: 7 }

gates:
  ticket_approval: human
  pr_approval: human{{PR_APPROVAL_NOTE}}
  # Until the factory gates are live, the listed external writes are shown to
  # the user and wait for approval. Issue and PR text, comments and label
  # changes are auto-approved; merges stay with the human (pr_approval).
  confirm_external_writes: true
  confirm_external_writes_scope: []

limits:
  concurrent_deliveries: 2
  fix_rounds: 3
  runs_per_day: 20
  environment_repair_attempts: 2

# Pre-review checks, run from the ticket worktree. Non-zero exit = failure.
# `requires: <command>`: when the command is missing the check reports `skipped`.
{{CHECKS_NOTE}}
checks:
  - name: whitespace
    stage: pre-review
    mode: blocking
    run: git diff --check "origin/${FACTORY_BASE:-main}...HEAD"
  - name: setup-scripts-parse
    stage: pre-review
    mode: blocking
    run: for f in roles/*.sh roles/*/setup.sh; do bash -n "$f" || exit 1; done
  - name: shellcheck
    stage: pre-review
    mode: advisory
    requires: uvx
    run: uvx --quiet --from shellcheck-py==0.10.0.1 shellcheck -x roles/*.sh roles/*/setup.sh
{{PROJECT_CHECKS}}
