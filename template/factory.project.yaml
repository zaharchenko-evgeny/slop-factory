# A factory project (ADR-0016). `skills/factory-setup/render.py --project ANSWERS OUT` fills the placeholders.
# Generated below the header: `environments`, `workflow`, `states` and `commands`, and workflows/delivery.yaml, are
# `factory migrate workflow` of the engine's workflows/nodes.yaml (factory/tests/test_upgrade.py).
engine: "{{ENGINE_REF}}"
project:
  name: "{{PROJECT_NAME}}"
team_repository: "{{TEAM_REPOSITORY_URL}}"
# Exactly one repository has role primary; list other project repositories with role project (ADR-0017).
repositories:
  - name: "{{REPOSITORY_NAME}}"
    url: "{{REPOSITORY_URL}}"
    default_branch: main
    role: primary
tracker:
  adapter: github-issues
  repository: "{{TRACKER_REPOSITORY}}"
notify:
  github_user: "{{GITHUB_USER}}"
  providers: [{ kind: github-inbox }]
targets:
  air:
    bot_login: jetbrains-air[bot]
    models:
      cheap: "{{MODEL_CHEAP}}"
      mid: "{{MODEL_MID}}"
      strong: "{{MODEL_STRONG}}"
      review: "{{MODEL_REVIEW}}"
      review_strong: "{{MODEL_REVIEW_STRONG}}"
# --- generated by `factory/upgrade.py --generate-template`; do not edit below this line
environments:
  read:
    repositories:
    - '{{REPOSITORY_NAME}}'
    startup: .air/cloud/startup.sh
    secrets: []
    domains:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - '*.blob.core.windows.net'
    - pypi.org
    - files.pythonhosted.org
    vm: default
  write:
    repositories:
    - '{{REPOSITORY_NAME}}'
    startup: .air/cloud/startup.sh
    secrets: []
    domains:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - '*.blob.core.windows.net'
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    vm: default
  ops:
    repositories:
    - team
    startup: .air/cloud/startup.sh
    secrets: []
    domains:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - pypi.org
    - files.pythonhosted.org
    vm: default
workflow: workflows/delivery.yaml
states:
  draft:
    kind: waiting
    store:
      label: factory:draft
  triage:
    kind: active
    store:
      label: factory:triage
  ready:
    kind: active
    store:
      label: factory:ready
  in-dev:
    kind: active
    store:
      label: factory:in-dev
  in-review:
    kind: active
    store:
      label: factory:in-review
  changes-requested:
    kind: active
    store:
      label: factory:changes-requested
  approved:
    kind: active
    store:
      label: factory:approved
  done:
    kind: final
    store:
      label: factory:done
  blocked:
    kind: waiting
    store:
      label: factory:blocked
  needs-answers:
    kind: waiting
    store:
      label: factory:needs-answers
  split:
    kind: active
    store:
      label: factory:split
  not-actionable:
    kind: final
    store:
      label: factory:not-actionable
  investigating:
    kind: waiting
    store:
      label: factory:investigating
  ci-red:
    kind: active
    store:
      pr: ci-red
  ci-green:
    kind: active
    store:
      pr: ci-green
  pr-merged:
    kind: final
    store:
      pr: merged
commands:
  implement-<tier>:
    store:
      label: factory:implement-<tier>
  adopt:
    store:
      pr_label: factory:adopt
  review-<focus>:
    store:
      pr_label: factory:review-<focus>
  rereview-<focus>:
    store:
      pr_label: factory:rereview-<focus>
  fix-<tier>:
    store:
      pr_label: factory:fix-<tier>
  update-<tier>:
    store:
      pr_label: factory:update-<tier>
