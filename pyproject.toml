[project]
name = "slop-factory"
version = "0.1.0"
description = "Slop factory engine: the gate, the node chart and the deploy plan"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
factory = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "factory" }
py-modules = ["cli", "config", "contracts", "deploy", "gate", "gate_github", "gate_port", "github_tracker", "nodes", "notify"]
