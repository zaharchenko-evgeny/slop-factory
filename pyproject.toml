[project]
name = "slop-factory"
version = "0.1.0"
description = "Slop factory engine: the gate, the node chart and the deploy plan"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jinja2>=3"]

[project.scripts]
factory = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inbox", "inbox.providers"]
package-dir = { "" = "factory" }
py-modules = ["cli", "config", "contracts", "definition", "deploy", "doctor", "gate", "gate_github", "gate_port", "gate_space", "github_graphql", "github_tracker", "local", "nodes", "project", "reconcile", "upgrade", "vocab", "workflow", "youtrack_tracker"]
