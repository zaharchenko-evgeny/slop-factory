[project]
name = "slop-factory"
version = "0.1.0"
description = "Slop factory engine: the gate, the node chart and the deploy plan"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jinja2>=3"]

[project.scripts]
factory = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plugins", "ports", "factory_plugins", "factory_plugins.comments", "factory_plugins.notify", "factory_plugins.notify_email", "factory_plugins.github", "factory_plugins.youtrack"]
package-dir = { "" = "factory" }
py-modules = ["cli", "config", "contracts", "definition", "deploy", "derive", "doctor", "effects", "gate", "gate_port", "gate_space", "gate_tracker", "local", "nodes", "project", "reconcile", "retro", "scopes", "team_setup", "upgrade", "vocab", "workflow"]
